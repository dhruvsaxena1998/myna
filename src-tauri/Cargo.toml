[package]
name = "myna"
version = "0.0.2-beta.4"
description = "Dictation and meeting notes for macOS, local by default"
authors = ["Dhruv Saxena"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "myna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "1.0.9", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = "3"
sha2 = "0.10"
parakeet-rs = { version = "0.4.4", default-features = false, features = ["cpu", "sortformer", "load-dynamic", "api-28"] }
whisper-rs = { version = "0.16", features = ["metal"] }
tauri-plugin-global-shortcut = "2.4.1"
cpal = "0.18.2"
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSAnimation", "NSAnimationContext", "NSAppearance", "NSApplication", "NSColor", "NSGlassEffectView", "NSResponder", "NSScreen", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFString", "CFNumber"] }
text2num = { version = "2.8.0", default-features = false, features = ["en", "std"] }
tauri-plugin-updater = "2.14.1"
semver = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
hound = "3.5"
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
