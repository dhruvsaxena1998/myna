[package]
name = "myna"
version = "0.1.0"
edition = "2021"

[lib]
name = "myna_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "1", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
url = "2"
tauri-plugin-global-shortcut = "2"
cpal = "0.18.2"
arboard = "3.7.0"
hound = "3.5.1"
libc = "0.2"
parakeet-rs = { version = "0.4.3", features = ["sortformer"] }
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
core-foundation = "0.10"
security-framework = "3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-foundation = "0.3"
core-graphics = "0.25"
objc2-screen-capture-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-image-io = "0.3"
