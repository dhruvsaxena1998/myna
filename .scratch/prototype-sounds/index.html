const state = { start: "Tink", stop: "Pop", talk: 2 }; // what the app plays today
const play = (n) => { const a = new Audio(SOUNDS[n]); a.play(); return new Promise((r) => (a.onended = r)); };
function render() {
  document.getElementById("state").textContent = JSON.stringify(state, null, 2);
  document.getElementById("list").innerHTML = Object.keys(SOUNDS).map((n) => `<tr><td>${n}</td>
    <td><button data-play="${n}">▶ Play</button></td>
    <td><button data-start="${n}" class="${state.start === n ? "on" : ""}">Start</button></td>
    <td><button data-stop="${n}" class="${state.stop === n ? "on" : ""}">Stop</button></td></tr>`).join("");
}
document.getElementById("list").onclick = (e) => {
  const b = e.target.dataset;
  if (b.play) play(b.play);
  if (b.start) (state.start = b.start), play(b.start), render();
  if (b.stop) (state.stop = b.stop), play(b.stop), render();
};
document.getElementById("try").onclick = async () => {
  const pill = document.getElementById("pill");
  await play(state.start);
  pill.classList.add("show");
  await new Promise((r) => setTimeout(r, state.talk * 1000)); // as if you were talking
  pill.classList.remove("show");
  play(state.stop);
};
render();
