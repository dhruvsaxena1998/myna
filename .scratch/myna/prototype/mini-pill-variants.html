<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini recording pill: variants</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    --hud-bg: rgba(28,28,30,.74); --hud-fg: #F5F5F7; --hud-2: rgba(245,245,247,.72);
    --hud-fill: rgba(255,255,255,.14); --hud-edge: rgba(255,255,255,.20);
    --rec: #FF453A; --shadow-hud: 0 10px 30px rgba(0,0,0,.50);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 var(--font); }
  header { padding: 4px 0 8px; display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header p { margin: 0; color: var(--muted-foreground, #6e6e73); }
  .ctl { margin-left: auto; display: flex; gap: 8px; }
  .ctl button { font: inherit; padding: 5px 12px; border-radius: 7px; border: 0; background: var(--secondary, #fff); color: var(--secondary-foreground, inherit); box-shadow: 0 0 0 .5px var(--border, rgba(0,0,0,.18)); cursor: pointer; }
  .ctl button[aria-pressed="true"] { background: var(--primary, #1d1d1f); color: var(--primary-foreground, #fff); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; padding: 8px 0 4px; }
  figure { margin: 0; }
  /* A desk: a blurred window behind, so the glass reads like it does over real apps. */
  .desk { position: relative; height: 190px; border-radius: 12px; overflow: hidden;
    background: radial-gradient(120% 90% at 20% 10%, #c9d6e8 0, #9fb3cc 45%, #6f8199 100%); }
  .desk::before { content: ""; position: absolute; left: 22px; top: 18px; right: 60px; bottom: 54px; border-radius: 9px; background: #fbfbfd; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .desk::after { content: ""; position: absolute; left: 44px; top: 44px; width: 55%; height: 60px;
    background: repeating-linear-gradient(#d9d9de 0 6px, transparent 6px 16px); border-radius: 3px; }
  .at { position: absolute; bottom: 16px; left: 50%; translate: -50% 0; z-index: 1; }
  .at.edge { left: auto; right: 0; bottom: 50%; translate: 0 50%; }
  figcaption { padding: 10px 2px 0; }
  figcaption b { font-weight: 600; }
  figcaption span { display: block; color: var(--muted-foreground, #6e6e73); }

  .hud { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; white-space: nowrap;
    background: var(--hud-bg); color: var(--hud-fg); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 0 0 .5px var(--hud-edge), var(--shadow-hud); cursor: grab; transition: padding .18s ease-out, gap .18s ease-out; }
  time { font-variant-numeric: tabular-nums; }
  .dim { color: var(--hud-2); }
  .paused .live { color: var(--hud-2) !important; }

  /* Hover controls, shared: they slide out of the pill. */
  .acts { display: inline-flex; gap: 2px; max-width: 0; overflow: hidden; opacity: 0; transition: max-width .2s ease-out, opacity .15s; }
  .hud:hover .acts, .show-acts .acts { max-width: 90px; opacity: 1; }
  .acts button { width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 11px; background: none; color: var(--hud-2); cursor: default; }
  .acts button:hover { background: var(--hud-fill); color: var(--hud-fg); }
  .acts svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .acts .stop rect { fill: currentColor; stroke: none; }

  /* A: today's mini: five red bars. */
  .a .lvl { display: flex; align-items: center; gap: 3px; height: 16px; color: var(--rec); }
  .a .lvl i { width: 3px; height: 16px; border-radius: 2px; background: currentColor; transition: transform 80ms linear; }

  /* B: a short scrolling trace, the last ~3 s of the mic. */
  .b .trace { display: flex; align-items: center; gap: 2px; height: 18px; width: 70px; color: var(--rec); }
  .b .trace i { flex: none; width: 2px; border-radius: 1px; background: currentColor; }

  /* C: dot, time and bars: still tiny, but it says how long. */
  .c .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rec); animation: pulse 1.6s ease-in-out infinite; }
  .c .lvl { display: flex; align-items: center; gap: 2px; height: 12px; color: var(--hud-2); }
  .c .lvl i { width: 2px; height: 12px; border-radius: 1px; background: currentColor; transition: transform 80ms linear; }
  .paused .dot { animation: none; background: var(--hud-2); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* D: a breathing ring around a red dot; no words at all. */
  .d .hud { width: 30px; padding: 0; justify-content: center; gap: 0; }
  .d .hud:hover { width: auto; padding: 0 6px 0 4px; gap: 4px; }
  .d .orb { position: relative; width: 22px; height: 22px; flex: none; display: grid; place-items: center; }
  .d .orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--rec);
    transform: scale(var(--s, .7)); opacity: var(--o, .4); transition: transform 80ms linear, opacity 80ms linear; }
  .d .orb::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
  .paused.d .orb::after, .d .paused .orb::after { background: var(--hud-2); }

  /* E: a tab against the screen edge, half off it; hover pulls it out. */
  .e .hud { height: 46px; width: 18px; padding: 0; border-radius: 10px 0 0 10px; flex-direction: column; justify-content: center; gap: 2px; }
  .e .hud:hover { width: auto; height: 30px; flex-direction: row; padding: 0 10px 0 12px; gap: 8px; border-radius: 15px 0 0 15px; }
  .e .vlvl { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--rec); }
  .e .vlvl i { height: 3px; width: 10px; border-radius: 2px; background: currentColor; transition: transform 80ms linear; }
  .e .hud:hover .vlvl { flex-direction: row; } .e .hud:hover .vlvl i { width: 3px; height: 14px; }
  .e .when { display: none; } .e .hud:hover .when { display: inline; }

  /* F: Me and Them, two thin meters: shows the call audio is being caught too. */
  .f .pair { display: grid; gap: 3px; width: 54px; }
  .f .m { height: 4px; border-radius: 2px; background: var(--hud-fill); overflow: hidden; }
  .f .m i { display: block; height: 100%; border-radius: 2px; transition: width 80ms linear; }
  .f .me i { background: var(--rec); } .f .them i { background: var(--hud-fg); opacity: .8; }
  .f .lab { font-size: 10px; letter-spacing: .02em; }
</style>
</head>
<body>
<header>
  <h1>Mini recording pill</h1>
  <p>Hover a pill for its controls. The mic is simulated: talk, pause, them talking.</p>
  <div class="ctl">
    <button id="pause" aria-pressed="false">Paused</button>
    <button id="hold" aria-pressed="false">Show controls</button>
  </div>
</header>
<main class="grid" id="grid"></main>

<template id="acts">
  <span class="acts">
    <button title="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <button title="Stop" class="stop"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg></button>
    <button title="Expand"><svg viewBox="0 0 24 24"><path d="M14 5h5v5M10 19H5v-5M19 5l-6 6M5 19l6-6"/></svg></button>
  </span>
</template>

<script>
  const V = [
    ["a", "A · Today", "Five red bars. Says it's recording, nothing else."],
    ["b", "B · Rolling trace", "The last few seconds of your voice scroll by, like the Waveform dictation pill."],
    ["c", "C · Dot, time, bars", "Still small, but you can see how long without opening it."],
    ["d", "D · Breathing ring", "A 30px circle; the ring swells with your voice. The quietest one."],
    ["e", "E · Edge tab", "Docks to the screen edge, mostly out of the way; hover pulls it out."],
    ["f", "F · Me and Them", "Two thin meters: proof both sides of the call are being caught."],
  ];
  const acts = () => document.getElementById("acts").innerHTML;
  const body = {
    a: () => `<span class="lvl live">${"<i></i>".repeat(5)}</span>${acts()}`,
    b: () => `<span class="trace live">${"<i></i>".repeat(24)}</span>${acts()}`,
    c: () => `<span class="dot"></span><time class="clock">12:04</time><span class="lvl">${"<i></i>".repeat(4)}</span>${acts()}`,
    d: () => `<span class="orb"></span>${acts()}`,
    e: () => `<span class="vlvl live">${"<i></i>".repeat(4)}</span><time class="when clock">12:04</time>${acts()}`,
    f: () => `<span class="pair"><span class="m me"><i></i></span><span class="m them"><i></i></span></span><time class="clock dim">12:04</time>${acts()}`,
  };
  document.getElementById("grid").innerHTML = V.map(([k, t, d]) =>
    `<figure class="${k}"><div class="desk"><div class="at${k === "e" ? " edge" : ""}"><div class="hud">${body[k]()}</div></div></div>
     <figcaption><b>${t}</b><span>${d}</span></figcaption></figure>`).join("");

  // A fake call: you talk in bursts, then they do.
  let t = 0, secs = 724, paused = false;
  const W = [0.5, 0.8, 1, 0.75, 0.45];
  const trace = Array(24).fill(0);
  function voice(phase) {
    const talk = Math.sin(t / 900 + phase) > 0.1;
    return talk ? Math.min(1, 0.25 + 0.6 * Math.abs(Math.sin(t / 90 + phase * 3)) * (0.6 + 0.4 * Math.random())) : 0.03 * Math.random();
  }
  setInterval(() => {
    t += 120;
    const me = paused ? 0 : voice(0), them = paused ? 0 : voice(Math.PI);
    trace.shift(); trace.push(me);
    document.querySelectorAll(".a .lvl i").forEach((i, n) => (i.style.transform = `scaleY(${0.2 + 0.8 * me * W[n]})`));
    document.querySelectorAll(".c .lvl i").forEach((i, n) => (i.style.transform = `scaleY(${0.25 + 0.75 * me * W[n + 1]})`));
    document.querySelectorAll(".e .vlvl i").forEach((i, n) => (i.style.transform = `scaleX(${0.3 + 0.7 * me * W[n]})`));
    document.querySelectorAll(".b .trace i").forEach((i, n) => (i.style.height = `${2 + 16 * trace[n]}px`));
    const o = document.querySelector(".d .orb");
    o.style.setProperty("--s", 0.7 + 0.45 * me); o.style.setProperty("--o", 0.3 + 0.7 * me);
    document.querySelector(".f .me i").style.width = `${8 + 92 * me}%`;
    document.querySelector(".f .them i").style.width = `${8 + 92 * them}%`;
  }, 120);
  setInterval(() => {
    if (!paused) secs++;
    document.querySelectorAll(".clock").forEach((c) => (c.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`));
  }, 1000);
  const toggle = (id, fn) => document.getElementById(id).addEventListener("click", (e) => {
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", on); fn(on);
  });
  toggle("pause", (on) => { paused = on; document.querySelectorAll(".hud").forEach((h) => h.classList.toggle("paused", on)); });
  toggle("hold", (on) => document.querySelectorAll(".hud").forEach((h) => h.classList.toggle("show-acts", on)));
</script>
</body>
</html>
