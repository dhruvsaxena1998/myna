<!doctype html>
<!-- PROTOTYPE, throwaway. Question: how does an opened trace show the rules step's edits (#72) and the dictation's numbers?
     Round 2: the user picked Step cards and cut the Speech-to-text and Pasted cards; variants now try three ways to show the numbers.
     Open in a browser. ←/→ or the bar: variant. 1–5: sample dictation. T: theme. Hover an edit for its detail. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · trace view</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;--font-mono:ui-monospace,"SF Mono",Menlo,monospace;--fs-caption:11px;--fs-footnote:12px;--lh-footnote:16px;--fs-body:13px;--lh-body:18px;--fs-reading:15px;--fs-title3:15px;--lh-title3:20px;--fs-title2:18px;--lh-title2:24px;--r-sm:8px;--r-md:10px;--r-lg:14px;--r-full:999px;--h-ctl-sm:24px;--h-toolbar:52px;
 --bg-content:#F7F7F9;--bg-inset:#EFEFF2;--bg-raised:#FFF;--fill-field:rgba(0,0,0,.045);--fill-control:rgba(255,255,255,.92);--fill-track:rgba(0,0,0,.10);--line:rgba(0,0,0,.07);--line-strong:rgba(0,0,0,.16);--text:#1D1D1F;--text-2:#4A4A50;--text-3:#66666C;--caution:#C77700;--caution-soft:rgba(199,119,0,.10);--caution-text:#8A5300;
 --k-filler:#2B6CD8;--k-repeat:#C26A00;--k-cutoff:#8A47C2;--k-number:#0E8A7A;--k-word:#C2306B;
 --t-load:#C77700;--t-stt:#0A64D8;--t-rules:#5E9BEA;--t-paste:#A9C8F3}
:root[data-theme="dark"]{--bg-content:#1E1E21;--bg-inset:#2A2A2D;--bg-raised:#323236;--fill-field:rgba(255,255,255,.07);--fill-control:rgba(255,255,255,.1);--fill-track:rgba(255,255,255,.10);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);--text:#F5F5F7;--text-2:#C7C7CC;--text-3:#98989F;--caution:#FFD60A;--caution-soft:rgba(255,214,10,.12);--caution-text:#FFD60A;
 --k-filler:#6AA8FF;--k-repeat:#FFB04A;--k-cutoff:#C99BFF;--k-number:#4FD1BE;--k-word:#FF7AA8;
 --t-load:#E0A030;--t-stt:#3D8BFF;--t-rules:#7FB0FF;--t-paste:#3A5F96}
body{font:var(--fs-body)/var(--lh-body) var(--font);color:var(--text);margin:0;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box} button{font:inherit;color:inherit}
.win{border-radius:16px;overflow:hidden;background:var(--bg-content);box-shadow:0 0 0 .5px var(--line-strong);max-width:900px;margin:0 auto}
.toolbar{min-height:var(--h-toolbar);display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:.5px solid var(--line)}
.toolbar h1{font-size:var(--fs-title2);line-height:var(--lh-title2);margin:0;font-weight:600}
.crumb{color:var(--text-3)}
.page{padding:14px;display:grid;gap:14px}
.card{background:var(--bg-inset);border-radius:var(--r-lg);box-shadow:inset 0 0 0 .5px var(--line);padding:12px 14px}
.card h2{font-size:var(--fs-title3);line-height:var(--lh-title3);margin:0 0 2px;font-weight:600;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.meta{color:var(--text-3);font-size:var(--fs-footnote);line-height:var(--lh-footnote);font-weight:400}
.text{font-size:var(--fs-reading);line-height:30px;margin-top:8px}
.num{font-variant-numeric:tabular-nums}
.e{border-radius:4px;padding:1px;cursor:default}
.e del{text-decoration-thickness:1.5px;opacity:.75}
.e ins{text-decoration:none;font-weight:600}
.e[data-k]{background:color-mix(in srgb,var(--kc) 14%,transparent);box-shadow:inset 0 -2px 0 var(--kc)}
.e[data-k] del{color:var(--kc)}
.e.same{background:none;box-shadow:inset 0 -1.5px 0 color-mix(in srgb,var(--kc) 60%,transparent)}
.e.dim{background:none;box-shadow:none}
.e.hot{outline:2px solid var(--kc)}
[data-k="filler"]{--kc:var(--k-filler)}[data-k="repeat"]{--kc:var(--k-repeat)}[data-k="cutoff"]{--kc:var(--k-cutoff)}[data-k="number"]{--kc:var(--k-number)}[data-k="word"]{--kc:var(--k-word)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{height:var(--h-ctl-sm);border-radius:var(--r-full);border:0;padding:0 10px 0 8px;display:inline-flex;align-items:center;gap:6px;background:var(--fill-control);box-shadow:inset 0 0 0 .5px var(--line-strong);font-size:var(--fs-footnote);font-variant-numeric:tabular-nums;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--kc)}
.chip[aria-pressed="false"]{opacity:.45}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:10px;border-top:.5px solid var(--line);font-size:var(--fs-footnote)}
.words .w{display:inline-flex;gap:5px;align-items:baseline}
.words .w.off{color:var(--text-3)}
.words .w b{font-weight:600}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--bg-raised);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 .5px var(--line-strong);padding:8px 10px;font-size:var(--fs-footnote);line-height:var(--lh-footnote);max-width:300px;display:none}
.tip b{color:var(--kc)}
.badge{font-size:var(--fs-caption);border-radius:var(--r-full);padding:0 8px;height:20px;display:inline-flex;align-items:center;background:var(--fill-field);color:var(--text-2);font-weight:500}
.badge.bad{background:var(--caution-soft);color:var(--caution-text)}
.sub{color:var(--text-3);font-size:var(--fs-footnote)}
.tbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill-track);gap:2px}
.tbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:var(--fs-footnote);color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.big{font-size:26px;line-height:32px;font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--bg-inset);border-radius:var(--r-lg);box-shadow:inset 0 0 0 .5px var(--line);padding:10px 12px;display:grid;gap:2px;align-content:start}
.tile .big{font-size:20px;line-height:26px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;align-items:start}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:12px 1fr auto;gap:4px 8px;align-items:center;padding:5px 0;font-size:var(--fs-footnote)}
.steps li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.steps li.total{border-top:.5px solid var(--line);margin-top:4px;padding-top:8px;font-weight:600}
.steps li.total::before{background:none}
.steps .ms{font-variant-numeric:tabular-nums;color:var(--text-2)}
.steps .bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--fill-track);overflow:hidden}
.steps .bar i{display:block;height:100%;background:var(--c)}
.pbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;margin:0 auto 10px;width:max-content;max-width:100%;background:rgba(28,28,30,.9);color:#f5f5f7;padding:5px;border-radius:var(--r-full);font-size:12px}
.pbar button{border:0;background:none;color:inherit;height:26px;padding:0 9px;border-radius:var(--r-full);cursor:pointer}
.pbar button[aria-pressed="true"]{background:rgba(255,255,255,.22)}
.pbar .sep{width:1px;height:16px;background:rgba(255,255,255,.25);margin:0 3px}
</style>
</head>
<body>
<div class="pbar" id="bar"></div>
<div class="win">
  <div class="toolbar"><span class="crumb">Stats for nerds ›</span><div><h1 id="title"></h1><div class="sub" id="sub"></div></div><span style="flex:1"></span><span id="outcome"></span></div>
  <div class="page" id="page"></div>
</div>
<div class="tip" id="tip"></div>
<script>
// Sample data in the shape #72 stores: spans index the raw (speech-to-text) text; edits in the order they ran.
const KIND={filler:"Filler word",repeat:"Repeat",cutoff:"Cut-off word",number:"Number",word:"Word to remember"};
const PL={filler:"Filler words",repeat:"Repeats",cutoff:"Cut-off words",number:"Numbers",word:"Words to remember"};
const WORDS=[{spelling:"Myna"},{spelling:"Postgres"},{spelling:"Kubernetes"},{spelling:"Dhruv",heard:"Drove"},{spelling:"Desert Ant"}];
function E(raw,kind,find,rep,nth=0,extra={}){let at=-1;for(let i=0;i<=nth;i++)at=raw.indexOf(find,at+1);if(at<0)throw new Error(find);return{kind,span:[at,at+find.length],rep,...extra};}
function trace(o){const edits=o.edits(o.raw);return{...o,edits,clean:apply(o.raw,edits)};}
function tops(edits){return edits.filter(e=>!edits.some(o=>o!==e&&o.span[0]<=e.span[0]&&o.span[1]>=e.span[1]&&(o.span[1]-o.span[0])>(e.span[1]-e.span[0]))).sort((a,b)=>a.span[0]-b.span[0]);}
function apply(raw,edits){let out="",at=0;for(const e of tops(edits)){out+=raw.slice(at,e.span[0])+e.rep;at=e.span[1];}return out+raw.slice(at);}
const inner=(e,edits)=>edits.filter(o=>o!==e&&o.span[0]>=e.span[0]&&o.span[1]<=e.span[1]);
// timing in ms: load wait, speech to text, rules; the rest of let-go → pasted is the paste
const SAMPLES=[
 trace({title:"Ship the Postgres fix",at:"Today 14:32",app:"Slack",mode:"Hold to talk",model:"Parakeet TDT 0.6B v3",audio:7.4,load:0,stt:312,rules:2,r2p:388,lang:"en",tidy:true,outcome:"Pasted",
  raw:"Um, so I I think we should uh ship the post gres fix with twenty uh five pods. Ask Drove to ch- check Kubernetes.",
  edits:r=>[E(r,"filler","Um, s","S"),E(r,"filler","uh ","",0),E(r,"filler","uh ","",1),E(r,"repeat","I ","",1),E(r,"cutoff","ch- ",""),E(r,"number","twenty uh five","25"),
   E(r,"word","post gres","Postgres",0,{how:"spelling",entry:{spelling:"Postgres"}}),E(r,"word","Drove","Dhruv",0,{how:"heard",entry:{spelling:"Dhruv",heard:"Drove"}}),
   E(r,"word","Kubernetes","Kubernetes",0,{how:"spelling",unchanged:true,entry:{spelling:"Kubernetes"}})]}),
 trace({title:"Nothing to tidy",at:"Today 11:05",app:"Mail",mode:"Tap to start and stop",model:"Parakeet TDT 0.6B v3",audio:3.1,load:1420,stt:205,rules:1,r2p:1710,lang:"en",tidy:true,outcome:"Pasted",raw:"Send the deck to Priya before lunch.",edits:()=>[]}),
 trace({title:"Tidy up switched off",at:"Yesterday 18:40",app:"Notes",mode:"Hold to talk",model:"Whisper large-v3 turbo",audio:2.6,load:0,stt:540,rules:1,r2p:601,lang:"en",tidy:false,outcome:"Pasted",raw:"Uh I I think postgres is fine.",edits:r=>[E(r,"word","postgres","Postgres",0,{how:"spelling",entry:{spelling:"Postgres"}})]}),
 trace({title:"German, kept as said",at:"Yesterday 09:12",app:"Safari",mode:"Hold to talk",model:"Whisper large-v3 turbo",audio:3.8,load:0,stt:610,rules:1,r2p:655,lang:"de",tidy:true,outcome:"Pasted",raw:"Ich glaube, äh, wir sollten das das mit Myna machen.",edits:r=>[E(r,"word","Myna","Myna",0,{how:"spelling",unchanged:true,entry:{spelling:"Myna"}})]}),
 trace({title:"Only filler",at:"2 Nov 16:20",app:"Terminal",mode:"Hold to talk",model:"Parakeet TDT 0.6B v3",audio:0.9,load:0,stt:98,rules:0,r2p:120,lang:"en",tidy:true,outcome:"Didn’t hear anything",raw:"Um.",edits:r=>[E(r,"filler","Um.","")]}),
];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ms=n=>n>=1000?`${(n/1000).toFixed(2)} s`:`${n} ms`;
function marks(raw,edits,o={}){let out="",at=0;for(const e of tops(edits)){out+=esc(raw.slice(at,e.span[0]));const i=S.t.edits.indexOf(e),old=raw.slice(...e.span),show=o.show?o.show(e):true;
 if(!show)out+=`<span class="e dim" data-i="${i}">${esc(e.rep)}</span>`;
 else if(e.unchanged)out+=`<span class="e same" data-k="${e.kind}" data-i="${i}">${esc(old)}</span>`;
 else out+=`<span class="e" data-k="${e.kind}" data-i="${i}"><del>${esc(old)}</del>${e.rep?`<ins>${esc(e.rep)}</ins>`:""}</span>`;at=e.span[1];}return out+esc(raw.slice(at));}
const counts=t=>Object.fromEntries(Object.keys(KIND).map(k=>[k,t.edits.filter(e=>e.kind===k&&!e.unchanged).length]));
const rulesOn=t=>t.tidy&&t.lang==="en";
const S={v:"A",s:1,off:new Set(),theme:"dark"};S.t=SAMPLES[0];
const VARIANTS={A:"Timing strip",B:"Number tiles",C:"Side rail"};
const visible=e=>!S.off.has(e.kind);
const done=t=>t.outcome==="Pasted"?"pasted":"done";
const segs=t=>[["Model load wait",t.load,"--t-load"],["Speech to text",t.stt,"--t-stt"],["Rules",t.rules,"--t-rules"],[t.outcome==="Pasted"?"Paste":"Other",t.r2p-t.load-t.stt-t.rules,"--t-paste"]].filter(s=>s[1]>0);

// The one card left: the heard text with every rules edit marked, per-rule counts, and Words to remember for this dictation.
function rulesCard(t){
 const c=counts(t),n=Object.values(c).reduce((a,b)=>a+b,0);
 const hit=new Map(t.edits.filter(e=>e.kind==="word").map(e=>[e.entry.spelling,e]));
 const settings=`${t.lang==="en"?"English":"German"} · Tidy up ${t.tidy?"on":"off"}${rulesOn(t)?"":" · only Words to remember ran"}`;
 return `<section class="card"><h2>What Myna changed <span class="meta">${n?`${n} edit${n>1?"s":""}`:"nothing"} · ${settings}</span></h2>
  <div class="text">${marks(t.raw,t.edits,{show:visible})}</div>
  ${!t.clean?`<div class="meta" style="margin-top:4px">Nothing left after cleanup, so nothing was pasted.</div>`:""}
  ${n?`<div class="chips">${Object.keys(KIND).filter(k=>c[k]).map(k=>`<button class="chip" data-k="${k}" data-act="kind" aria-pressed="${!S.off.has(k)}"><i></i>${PL[k]} <b>${c[k]}</b></button>`).join("")}</div>`:""}
  <div class="words"><span class="meta">Words to remember</span>${WORDS.map(w=>{const e=hit.get(w.spelling),label=`${w.heard?`${esc(w.heard)} → `:""}${esc(w.spelling)}`;
   return `<span class="w ${e?"":"off"}">${e?`<b>${label}</b>`:label}<span class="meta">${!e?"not heard":e.unchanged?"already right":"fixed"}</span></span>`;}).join("")}</div>
 </section>`;}

function timingBar(t){return `<div class="tbar" role="img" aria-label="${segs(t).map(s=>`${s[0]} ${ms(s[1])}`).join(", ")}">${segs(t).map(s=>`<i style="width:${s[1]/t.r2p*100}%;background:var(${s[2]})"></i>`).join("")}</div>
 <div class="legend">${segs(t).map(s=>`<span style="--c:var(${s[2]})">${s[0]} <b class="num">${ms(s[1])}</b></span>`).join("")}</div>`;}

// A: one strip above the card: the headline time and where it went.
function viewA(t){return `<section class="card"><div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px"><span class="big">${ms(t.r2p)}</span><span class="meta">from letting go to ${done(t)} · ${t.audio.toFixed(1)} s of audio</span></div>${timingBar(t)}</section>${rulesCard(t)}`;}

// B: four tiles, then the card.
function viewB(t){const n=t.edits.filter(e=>!e.unchanged).length;return `<div class="tiles">
 <div class="tile"><span class="meta">Let go → ${done(t)}</span><span class="big">${ms(t.r2p)}</span><span class="meta">${t.audio.toFixed(1)} s of audio</span></div>
 <div class="tile"><span class="meta">Speech to text</span><span class="big">${ms(t.stt)}</span><span class="meta">${(t.audio*1000/t.stt).toFixed(0)}× real time</span></div>
 <div class="tile"><span class="meta">Model load wait</span><span class="big" ${t.load?`style="color:var(--caution-text)"`:""}>${t.load?ms(t.load):"None"}</span><span class="meta">${t.load?"cold start":"model was warm"}</span></div>
 <div class="tile"><span class="meta">Rules edits</span><span class="big">${n}</span><span class="meta">in ${ms(t.rules)}</span></div>
</div>${rulesCard(t)}`;}

// C: the card, with a narrow rail listing each step's time.
function viewC(t){return `<div class="split">${rulesCard(t)}
 <section class="card"><h2>Timing</h2><ul class="steps">${segs(t).map(s=>`<li style="--c:var(${s[2]})"><span>${s[0]}</span><span class="ms">${ms(s[1])}</span><span class="bar"><i style="width:${s[1]/t.r2p*100}%"></i></span></li>`).join("")}
  <li class="total"><span>Let go → ${done(t)}</span><span class="ms">${ms(t.r2p)}</span></li></ul>
  <div class="meta" style="margin-top:6px">${t.audio.toFixed(1)} s of audio</div></section></div>`;}

function render(){const t=S.t=SAMPLES[S.s-1];document.documentElement.dataset.theme=S.theme;
 document.getElementById("title").textContent=t.title;
 document.getElementById("sub").textContent=`${t.at} · ${t.app} · ${t.mode} · ${t.model}`;
 document.getElementById("outcome").innerHTML=`<span class="badge ${t.outcome==="Pasted"?"":"bad"}">${t.outcome}</span>`;
 document.getElementById("page").innerHTML={A:viewA,B:viewB,C:viewC}[S.v](t);
 document.getElementById("bar").innerHTML=Object.entries(VARIANTS).map(([k,l])=>`<button data-act="v" data-v="${k}" aria-pressed="${S.v===k}">${k} · ${l}</button>`).join("")+`<span class="sep"></span>`+SAMPLES.map((s,i)=>`<button data-act="s" data-s="${i+1}" aria-pressed="${S.s===i+1}" title="${s.title}">${i+1}</button>`).join("")+`<span class="sep"></span><button data-act="theme">${S.theme==="light"?"Dark":"Light"}</button>`;}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]");if(!b)return;
 if(b.dataset.act==="v")S.v=b.dataset.v;if(b.dataset.act==="s"){S.s=+b.dataset.s;S.off.clear();}
 if(b.dataset.act==="theme")S.theme=S.theme==="light"?"dark":"light";
 if(b.dataset.act==="kind")S.off.has(b.dataset.k)?S.off.delete(b.dataset.k):S.off.add(b.dataset.k);render();});
document.addEventListener("keydown",ev=>{const vs=Object.keys(VARIANTS),i=vs.indexOf(S.v);
 if(ev.key==="ArrowRight")S.v=vs[(i+1)%vs.length];else if(ev.key==="ArrowLeft")S.v=vs[(i+vs.length-1)%vs.length];
 else if(/^[1-5]$/.test(ev.key)){S.s=+ev.key;S.off.clear();}else if(ev.key.toLowerCase()==="t")S.theme=S.theme==="light"?"dark":"light";else return;render();});
const tip=document.getElementById("tip");
document.addEventListener("mouseover",ev=>{document.querySelectorAll(".hot").forEach(x=>x.classList.remove("hot"));const m=ev.target.closest("[data-i]");if(!m){tip.style.display="none";return;}
 const e=S.t.edits[+m.dataset.i];if(!e)return;document.querySelectorAll(`[data-i="${m.dataset.i}"]`).forEach(x=>x.classList.add("hot"));const ins=inner(e,S.t.edits);tip.dataset.k=e.kind;
 tip.innerHTML=`<b>${KIND[e.kind]}</b>${e.how?` · matched by ${e.how==="heard"?`heard-as “${esc(e.entry.heard)}”`:"spelling"}`:""}<br>“${esc(S.t.raw.slice(...e.span))}” → ${e.rep?`“${esc(e.rep)}”`:"removed"}${e.unchanged?" (already right)":""}${ins.length?`<br><span class="meta">Contains ${ins.map(o=>KIND[o.kind].toLowerCase()+` “${esc(S.t.raw.slice(...o.span).trim())}”`).join(", ")}, removed first</span>`:""}`;
 const r=m.getBoundingClientRect();tip.style.display="block";tip.style.left=`${Math.max(4,Math.min(r.left,innerWidth-310))}px`;tip.style.top=`${r.bottom+6}px`;});
render();
</script>
</body>
</html>
