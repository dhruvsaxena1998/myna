<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 280px; margin: 0; padding: 14px; font: 13px -apple-system, system-ui, sans-serif; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  p { margin: 0 0 10px; opacity: 0.75; }
  input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 5px 7px; font: 12px ui-monospace, monospace; }
  #state { opacity: 1; font-weight: 600; }
</style>
<h1>Myna</h1>
<p id="state"></p>
<p>Paste the pairing token from Myna → Settings → Meetings.</p>
<input id="token" placeholder="Pairing token" autocomplete="off" spellcheck="false">
<button id="save">Save</button>
<script src="popup.js"></script>
