<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="meetings.css">
<link rel="stylesheet" href="ai.css">
<link rel="stylesheet" href="popover.css">
<style>
  body { font: 14px -apple-system, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin-top: 0; }
  label { display: block; margin: 12px 0; }
  .reason { color: #666; margin: 4px 0 12px; }
  button { font: inherit; padding: 6px 14px; }
</style>
</head>
<body><div id="app"></div>
<script src="meetings.js"></script>
<script src="ai.js"></script>

<script>
const { invoke } = window.__TAURI__.core;
const app = document.getElementById("app");
const get = (key) => invoke("get_setting", { key });
const set = (key, value) => invoke("set_setting", { key, value: String(value) });

const PERMS = [
  ["Microphone", "Myna needs it to hear your voice for dictation and meetings."],
  ["Accessibility", "Myna needs it to paste text and use the global hotkey."],
  ["Screen Recording", "Myna needs it to capture meeting audio and screenshots."],
];

async function modulesForm(onChange) {
  const form = document.createElement("div");
  for (const [key, name] of [["dictation_enabled", "Dictation"], ["meetings_enabled", "Meetings"]]) {
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = (await get(key)) === "true";
    box.onchange = async () => { await set(key, box.checked); onChange && onChange(); };
    label.append(box, " " + name);
    form.append(label);
  }
  return form;
}

const ICONS = {
  gear: '<circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>',
  dl: '<path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/>',
  check: '<path d="M3 8.5l3 3 7-7"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  mic: '<rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2M5.5 14.5h5"/>',
  spark: '<path d="M8 2l1.4 3.6L13 7l-3.6 1.4L8 12l-1.4-3.6L3 7l3.6-1.4z"/>',
  lock: '<rect x="3.5" y="7" width="9" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>',
  list: '<path d="M2.5 4h11M2.5 8h11M2.5 12h7"/>',
};
const icon = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 16 16" aria-hidden="true">${ICONS[name]}</svg>`;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmtSize = (b) => (b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.round(b / 1e6) + " MB");

const TASKS = [
  ["stt", "Speech to text", ["dictation_enabled", "meetings_enabled"]],
  ["diarization", "Speaker separation", ["meetings_enabled"]],
];

// Models whose use needs the "Powered by Desert Ant Labs" credit while selected.
const BY_DESERT_ANT = new Set(["voz"]);
// The Voz SDK phones home on every model load, so its row says so whether or not it is selected.
const OFF_DEVICE = {
  voz: "Sends a license check to Desert Ant when the model loads. No audio or text.",
  uhm: "Sends a license check to Desert Ant when the model loads. No audio or text.",
};

const PAGES = [["modules", "Modules", "gear"], ["dictation", "Dictation", "mic"], ["meetings", "Meetings", "list"], ["models", "Models", "dl"], ["ai", "AI provider", "spark"], ["experimental", "Experimental", "lock"]];
const KEY_SYMBOLS = { Alt: "⌥", Option: "⌥", Control: "⌃", Ctrl: "⌃", Shift: "⇧", Super: "⌘", Command: "⌘", Cmd: "⌘" };
const fmtKey = (k) => k.split("+").map((p) => KEY_SYMBOLS[p] || p.replace(/^(Key|Digit)/, "")).join("");

let settingsPage = "models";
let pollTimer;

async function settings() {
  document.body.className = "set";
  app.innerHTML = `<nav class="sidebar" aria-label="Settings"></nav><div class="content"><div class="toolbar"><h1 id="title"></h1></div><div class="page" id="page"></div></div>`;
  const nav = app.querySelector(".sidebar");
  for (const [id, label, ic] of PAGES) {
    const b = document.createElement("button");
    b.className = "nav";
    b.innerHTML = icon(ic) + label;
    if (id === settingsPage) b.setAttribute("aria-current", "page");
    b.onclick = () => { settingsPage = id; settings(); };
    nav.append(b);
  }
  clearTimeout(pollTimer);
  const page = document.getElementById("page");
  document.getElementById("title").textContent = PAGES.find((p) => p[0] === settingsPage)[1];
  if (settingsPage === "models") return modelsPage(page);
  if (settingsPage === "dictation") return dictationPage(page);
  if (settingsPage === "ai") return ai.settings(page);
  if (settingsPage === "meetings") return meetingsPage(page);
  if (settingsPage === "experimental") return experimentalPage(page);
  page.innerHTML = '<section class="group"><h2>Enable</h2><div class="box"></div></section>';
  page.querySelector(".box").append(...(await modulesForm()).children);
}

const MODS = [["ctrlKey", "Control"], ["altKey", "Alt"], ["shiftKey", "Shift"], ["metaKey", "Super"]];

// Resolves with a global-shortcut string like "Alt+Space", or null if cancelled (Esc, or focus left the button).
function recordHotkey(btn) {
  return new Promise((resolve) => {
    const end = (v) => { removeEventListener("keydown", on, true); btn.removeEventListener("blur", cancel); resolve(v); };
    const cancel = () => end(null);
    const on = (e) => {
      e.preventDefault();
      if (e.code === "Escape") return end(null);
      if (/^(Control|Alt|Shift|Meta)(Left|Right)$/.test(e.code)) return; // wait for the real key
      const mods = MODS.filter(([f]) => e[f]).map(([, name]) => name);
      if (!mods.length && !/^F\d+$/.test(e.code)) return; // a bare letter would hijack typing
      end([...mods, e.code].join("+"));
    };
    addEventListener("keydown", on, true);
    btn.addEventListener("blur", cancel);
    btn.focus();
  });
}

const sw = (id, on, label) => `<button class="switch" role="switch" id="${id}" aria-checked="${on}" aria-label="${esc(label)}"></button>`;
const flip = (b) => { const v = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", v); return v; };
const words = (n) => `${n} word${n === 1 ? "" : "s"}`;

async function dictationPage(page) {
  const { key, error } = await invoke("hotkey_status");
  const on = (await get("dictation_enabled")) === "true";
  const toggle = (await get("dictation_mode")) === "toggle";
  const keystrokes = (await get("paste_method")) === "keystrokes";
  const rules = (await get("dictation_cleanup")) !== "false";
  const delay = (await get("paste_delay_ms")) || "150";
  let dict = [];
  try { dict = JSON.parse((await get("dictionary")) || "[]"); } catch {}
  const note = error || (!on ? "Dictation is off. Turn it on under Modules." : toggle ? "Press once to start, again to paste." : "Hold it while you speak, release to paste.");
  page.innerHTML = `<section class="group"><h2>Hotkey</h2><div class="box">
<div class="prow"><div class="l">${toggle ? "Press to talk" : "Hold to talk"}</div><div class="d${error ? " err" : ""}">${esc(note)}</div><div class="r"><kbd>${esc(fmtKey(key))}</kbd><button class="btn quiet" id="change">Change</button></div></div>
<div class="prow single"><div class="l">Press to start, press to stop</div><div class="r">${sw("toggle", toggle, "Press to start, press to stop")}</div></div>
</div></section>
<section class="group"><h2>Output</h2><div class="box">
<div class="prow"><div class="l">Paste method</div><div class="d">Paste uses the clipboard and ⌘V, then restores it. Type keystrokes is for apps that block paste.</div><div class="r"><select class="field" id="method" aria-label="Paste method"><option value="clipboard">Paste</option><option value="keystrokes">Type keystrokes</option></select></div></div>
<div class="prow"><div class="l">Paste delay</div><div class="d">How long Myna waits after pasting before it puts your clipboard back. Raise it if an app pastes your old clipboard.</div><div class="r"><input class="field" id="delay" type="number" min="0" max="2000" step="50" value="${esc(delay)}" aria-label="Paste delay in milliseconds"${keystrokes ? " disabled" : ""}><span class="s">ms</span></div></div>
<div class="prow single"><div class="l">Remove filler words (um, uh, like, repeats)</div><div class="r">${sw("rules", rules, "Remove filler words")}</div></div>
<div class="prow"><div class="l">Personal dictionary</div><div class="d">Spell names and jargon your way. Leave “Heard as” blank to only fix the capitals.</div><div class="r"><span class="s" id="count"></span><button class="btn quiet" id="edit" aria-expanded="false">Edit…</button></div></div>
<div class="dict" id="dict" hidden></div>
</div></section>`;
  const q = (sel) => page.querySelector(sel);

  q("#change").onclick = async (e) => {
    e.currentTarget.textContent = "Press the new shortcut…";
    const combo = await recordHotkey(e.currentTarget);
    if (combo) await set("dictation_hotkey", combo); // the backend re-registers it and reports any clash
    dictationPage(page);
  };
  q("#toggle").onclick = async (e) => { await set("dictation_mode", flip(e.currentTarget) ? "toggle" : "hold"); dictationPage(page); };
  q("#rules").onclick = (e) => set("dictation_cleanup", flip(e.currentTarget));
  q("#method").value = keystrokes ? "keystrokes" : "clipboard";
  q("#method").onchange = (e) => { set("paste_method", e.target.value); q("#delay").disabled = e.target.value === "keystrokes"; };
  q("#delay").onchange = (e) => set("paste_delay_ms", e.target.value);

  const box = q("#dict");
  const saved = () => dict.filter((e) => e.to.trim());
  const save = () => { set("dictionary", JSON.stringify(saved())); q("#count").textContent = words(saved().length); };
  const draw = () => {
    box.innerHTML = dict.map((e, i) => `<div class="e"><input class="field" data-i="${i}" data-f="from" value="${esc(e.from)}" placeholder="Heard as (optional)" aria-label="Heard as"><span class="arrow" aria-hidden="true">→</span><input class="field" data-i="${i}" data-f="to" value="${esc(e.to)}" placeholder="Spelled as" aria-label="Spelled as"><button class="btn quiet" data-rm="${i}">Remove</button></div>`).join("")
      + `<div><button class="btn quiet" data-add>${icon("plus", "sm")} Add word</button></div>`;
  };
  q("#count").textContent = words(saved().length);
  box.onchange = (e) => { if (e.target.dataset.f) { dict[e.target.dataset.i][e.target.dataset.f] = e.target.value; save(); } };
  box.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.rm) { dict.splice(+b.dataset.rm, 1); save(); }
    else dict.push({ from: "", to: "" });
    draw();
    if (!b.dataset.rm) [...box.querySelectorAll(".e")].at(-1).querySelector("input").focus();
  };
  q("#edit").onclick = (e) => {
    const open = box.hidden;
    box.hidden = !open;
    e.currentTarget.setAttribute("aria-expanded", open);
    if (open) { if (!dict.length) dict.push({ from: "", to: "" }); draw(); }
  };
}

// Off-by-default passes, each with its own Dictation / Meetings switch pair.
async function experimentalPage(page) {
  const [st, { models }] = await Promise.all([invoke("ai_state"), invoke("list_models")]);
  const m = models.find((x) => x.id === "uhm");
  const pair = (id, keys, what) => `<div class="r pair">${["Dictation", "Meetings"].map((name, i) => `<label>${sw(id + i, keys[i], what + " for " + name)} ${name}</label>`).join("")}</div>`;
  const on = {};
  for (const k of ["uhm_dictation", "uhm_meetings", "ai_cleanup_dictation", "ai_cleanup_meetings"]) on[k] = (await get(k)) === "true";
  const size = `<span class="size">${fmtSize(m.size)}</span>`;
  const state = m.unavailable ? '<span class="pill alert">Unavailable</span>'
    : m.downloading !== null ? `${size}<span class="prog" role="progressbar" aria-label="Downloading Uhm" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(100 * m.downloading / m.size)}"><i style="width:${(100 * m.downloading / m.size).toFixed(1)}%"></i></span><button class="btn quiet" data-act="cancel_model">Cancel</button>`
    : m.status === "installed" ? `${size}<span class="pill ok">${icon("check", "sm")} Installed</span><button class="btn quiet" data-act="remove_model">Remove</button>`
    : `${size}<button class="btn" data-act="download_model">${icon("dl", "sm")} ${m.error ? "Retry" : "Download"}</button>`;
  page.innerHTML = `<section class="group"><h2>Cleanup</h2><div class="box">
<div class="prow single"><div class="l row">Uhm model <span class="xs">by Desert Ant</span> <span class="pill alert">Off-device</span></div><div class="r">${state}</div><div class="d${m.error || m.unavailable ? " err" : ""}">${esc(m.error || m.unavailable || OFF_DEVICE.uhm)}</div></div>
<div class="prow"><div class="l">Uhm filler detection</div><div class="d">Finds “uh” and “um” in the audio itself and silences them before transcription. Needs the model above. Runs on this Mac.</div>${pair("uhm", [on.uhm_dictation, on.uhm_meetings], "Uhm")}</div>
<div class="prow"><div class="l row">LLM cleanup${st.off_device ? ' <span class="pill alert">sends text off this Mac</span>' : ""}</div><div class="d${st.problem ? " err" : ""}">${esc(st.problem || "Sends the text to your AI provider to tidy grammar and phrasing. Falls back to the local text after 3 s.")}</div>${pair("llm", [on.ai_cleanup_dictation, on.ai_cleanup_meetings], "LLM cleanup")}</div>
</div><p class="note">Off by default. Each can be on for Dictation and Meetings separately. In Dictation the order is Uhm, speech to text, filler rules, LLM, then your dictionary. Meetings run Uhm and the LLM only, and only send lines that are in the transcript.</p></section>${on.uhm_dictation || on.uhm_meetings ? '<section class="group"><div class="box"><div class="prow single"><div class="l s">Powered by Desert Ant Labs</div></div></div></section>' : ""}`;
  ["uhm_dictation", "uhm_meetings"].forEach((k, i) => { page.querySelector("#uhm" + i).onclick = (e) => set(k, flip(e.currentTarget)); });
  ["ai_cleanup_dictation", "ai_cleanup_meetings"].forEach((k, i) => { page.querySelector("#llm" + i).onclick = (e) => set(k, flip(e.currentTarget)); });
  page.querySelectorAll("[data-act]").forEach((b) => { b.onclick = async () => { await invoke(b.dataset.act, { id: "uhm" }); experimentalPage(page); }; });
  if (m.downloading !== null) pollTimer = setTimeout(() => page.isConnected && experimentalPage(page), 500);
}

async function meetingsPage(page) {
  const { key, error } = await invoke("mute_hotkey_status");
  let always = [];
  try { always = JSON.parse((await get("mic_always_apps")) || "[]"); } catch {}
  // Apps Myna has recorded in, plus any already switched on whose meetings are gone.
  const seen = (await invoke("list_meetings")).map((m) => m.app);
  const apps = [...new Set([...seen, ...always].filter(Boolean))].sort();
  const rows = apps.length
    ? apps.map((a, i) => `<div class="prow single"><div class="l">${esc(a)}</div><div class="r">${sw("app" + i, always.includes(a), "Always record mic in " + a)}</div></div>`).join("")
    : '<div class="prow single"><div class="d">Apps show up here after you record a meeting in them.</div></div>';
  page.innerHTML = `<section class="group"><h2>Mute</h2><div class="box">
<div class="prow"><div class="l">Mute hotkey</div><div class="d${error ? " err" : ""}">${esc(error || "Mutes and unmutes your mic in the transcript while a recording runs. The audio is always saved on this Mac.")}</div><div class="r"><kbd>${esc(fmtKey(key))}</kbd><button class="btn quiet" id="change">Change</button></div></div>
</div></section>
<section class="group"><h2>Always record mic</h2><div class="box">${rows}</div>
<p class="note">Myna can't read mute state in most call apps, so it keeps your side out of the transcript until you include it. Turn an app on to include your mic there unless you mute in Myna.</p></section>`;
  page.querySelector("#change").onclick = async (e) => {
    e.currentTarget.textContent = "Press the new shortcut…";
    const combo = await recordHotkey(e.currentTarget);
    if (combo) await set("mute_hotkey", combo); // the backend re-registers it and reports any clash
    meetingsPage(page);
  };
  apps.forEach((a, i) => {
    page.querySelector("#app" + i).onclick = (e) => {
      const on = flip(e.currentTarget);
      always = apps.filter((x) => (x === a ? on : always.includes(x)));
      set("mic_always_apps", JSON.stringify(always));
    };
  });
}

async function modelsPage(page) {
  const enabled = {};
  for (const k of ["dictation_enabled", "meetings_enabled"]) enabled[k] = (await get(k)) === "true";
  let shown = "";
  const damaged = new Set();
  const verified = new Set();

  async function refresh() {
    const { dir, models } = await invoke("list_models");
    if (!page.isConnected) return;
    clearTimeout(pollTimer);
    const busy = models.filter((m) => m.downloading !== null);
    const sig = JSON.stringify(models.map((m) => [m.id, m.status, m.downloading !== null, m.error, damaged.has(m.id)]));
    if (sig !== shown) { shown = sig; await render(dir, models); }
    for (const m of busy) {
      const bar = page.querySelector(`[data-prog="${m.id}"]`);
      if (bar) { bar.style.width = (100 * m.downloading / m.size).toFixed(1) + "%"; bar.parentElement.setAttribute("aria-valuenow", Math.round(100 * m.downloading / m.size)); }
    }
    // Hash installed models once per page visit: a corrupted file is flagged, not silently trusted.
    for (const m of models) {
      if (m.status === "installed" && !verified.has(m.id)) {
        verified.add(m.id);
        invoke("verify_model", { id: m.id }).then((ok) => { if (!ok) { damaged.add(m.id); refresh(); } });
      }
    }
    pollTimer = setTimeout(refresh, busy.length ? 500 : 2000);
  }

  async function render(dir, models) {
    page.innerHTML = "";
    const tasks = TASKS.filter(([, , needs]) => needs.some((k) => enabled[k]));
    if (!tasks.length) {
      page.innerHTML = '<p class="s">Turn on Dictation or Meetings under Modules to see the models they use.</p>';
      return;
    }
    let desertAnt = false;
    for (const [task, heading] of tasks) {
      const rows = models.filter((m) => m.task === task);
      const chosen = (await get("model_" + task)) || rows[0].id;
      desertAnt ||= BY_DESERT_ANT.has(chosen);
      const sec = document.createElement("section");
      sec.className = "group";
      sec.innerHTML = `<h2>${heading}</h2><div class="box" role="radiogroup" aria-label="${heading}"></div>`;
      for (const m of rows) sec.querySelector(".box").append(modelRow(m, task, chosen));
      if (task === "stt") sec.querySelector(".box").append(customRow());
      page.append(sec);
    }
    const store = document.createElement("section");
    store.className = "group";
    store.innerHTML = `<h2>Storage</h2><div class="box"><div class="prow single"><div class="l">Models folder</div><div class="r"><span class="s mono">${esc(dir.replace(/^\/Users\/[^/]+/, "~"))}</span><button class="btn quiet">Reveal</button></div></div></div>`;
    store.querySelector("button").onclick = () => invoke("reveal_models_dir");
    page.append(store);
    if (desertAnt) {
      const credit = document.createElement("section");
      credit.className = "group";
      credit.innerHTML = '<div class="box"><div class="prow single"><div class="l s">Powered by Desert Ant Labs</div></div></div>';
      page.append(credit);
    }
  }

  function modelRow(m, task, chosen) {
    const row = document.createElement("div");
    row.className = "prow";
    const bad = m.status === "damaged" || damaged.has(m.id);
    const err = m.error || (bad ? "Files are damaged. Download again to repair." : "");
    const size = m.size ? `<span class="size">${fmtSize(m.size)}</span>` : "";
    const remove = '<button class="btn quiet" data-act="remove">Remove</button>';
    let right;
    if (m.unavailable) {
      right = `${size}<span class="pill alert">Unavailable</span>`;
    } else if (m.downloading !== null) {
      right = `${size}<span class="prog" role="progressbar" aria-label="Downloading ${esc(m.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i data-prog="${m.id}"></i></span><button class="btn quiet" data-act="cancel">Cancel</button>`;
    } else if (m.local) {
      right = (bad ? '<span class="pill alert">Unusable</span>' : `<span class="pill ok">${icon("check", "sm")} Installed</span>`) + remove;
    } else if (m.status === "installed" && !bad) {
      right = `${size}<span class="pill ok">${icon("check", "sm")} Installed</span>${remove}`;
    } else {
      right = `${size}${bad ? '<span class="pill alert">Damaged</span>' : ""}${bad || m.custom ? remove : ""}<button class="btn" data-act="download">${icon("dl", "sm")} ${bad || m.error ? "Retry" : "Download"}</button>`;
    }
    row.innerHTML = `<div class="l"><label class="row pick"><input type="radio" name="${task}"${m.id === chosen ? " checked" : ""}${m.unavailable ? " disabled" : ""}><span class="radio"></span>${esc(m.name)}${BY_DESERT_ANT.has(m.id) ? ' <span class="xs">by Desert Ant</span>' : ""}${OFF_DEVICE[m.id] ? ' <span class="pill alert">Off-device</span>' : ""}</label></div><div class="d${err ? " err" : ""}">${esc(err || m.unavailable || m.desc)}${OFF_DEVICE[m.id] ? `<br>${esc(OFF_DEVICE[m.id])}` : ""}</div><div class="r">${right}</div>`;
    row.querySelector("input").onchange = async () => { await set("model_" + task, m.id); shown = ""; refresh(); };
    row.querySelectorAll("[data-act]").forEach((b) => {
      b.onclick = async () => {
        const act = b.dataset.act;
        if (act === "download") { damaged.delete(m.id); verified.add(m.id); await invoke("download_model", { id: m.id }); }
        if (act === "cancel") await invoke("cancel_model", { id: m.id });
        if (act === "remove") { damaged.delete(m.id); await invoke("remove_model", { id: m.id }); }
        clearTimeout(pollTimer);
        shown = "";
        refresh();
      };
    });
    return row;
  }

  // Advanced: a model of the user's own, from a path or a Hugging Face repo, for either runtime.
  function customRow() {
    const row = document.createElement("div");
    row.className = "prow single";
    row.innerHTML = `<div class="l s">Custom model path or Hugging Face repo…</div><div class="r"><button class="btn quiet">${icon("plus", "sm")} Add</button></div>`;
    row.querySelector("button").onclick = () => { row.replaceWith(customForm()); document.getElementById("custom-src").focus(); };
    return row;
  }

  function customForm() {
    const row = document.createElement("div");
    row.className = "prow";
    row.innerHTML = `<div class="l row"><select class="field" aria-label="Runtime"><option value="parakeet">Parakeet</option><option value="whisper">Whisper</option></select><input id="custom-src" class="field grow mono" aria-label="Model path or Hugging Face repo" placeholder="~/models/name or owner/repo" spellcheck="false" autocapitalize="off" autocomplete="off"></div><div class="d">Parakeet takes a folder of ONNX files, Whisper a ggml .bin file. A Hugging Face repo is downloaded for you.</div><div class="r"><button class="btn" data-act="add">Add</button><button class="btn quiet" data-act="cancel">Cancel</button></div>`;
    const [runtime, src, note, add] = ["select", "input", ".d", '[data-act="add"]'].map((q) => row.querySelector(q));
    const submit = async () => {
      add.disabled = true;
      add.textContent = "Checking…";
      try {
        await invoke("add_custom_model", { runtime: runtime.value, source: src.value });
      } catch (e) {
        note.textContent = e;
        note.classList.add("err");
        add.disabled = false;
        add.textContent = "Add";
        return;
      }
      clearTimeout(pollTimer);
      shown = "";
      refresh();
    };
    add.onclick = submit;
    src.onkeydown = (e) => { if (e.key === "Enter") submit(); };
    row.querySelector('[data-act="cancel"]').onclick = () => row.replaceWith(customRow());
    return row;
  }

  refresh();
}

// The floating pill: a separate click-through window the backend drives with "pill" events.
function pill() {
  document.body.className = "pillwin";
  const el = document.createElement("div");
  app.append(el);
  const levels = Array(9).fill(0);
  const show = (cls, html) => { el.className = "dpill " + cls; el.innerHTML = html; };
  window.__TAURI__.event.listen("pill", ({ payload: p }) => {
    if (p.kind === "idle") show("", `<span class="dot"></span><span>${p.toggle ? "Press" : "Hold"} <span class="k">${esc(fmtKey(p.hotkey))}</span> to talk</span>`);
    if (p.kind === "listening") {
      if (!el.classList.contains("rec")) levels.fill(0);
      levels.push(p.level);
      levels.shift();
      show("rec", `<span class="dot"></span><span class="meter" aria-hidden="true">${levels.map((l) => `<i style="height:${Math.round(3 + 11 * l)}px"></i>`).join("")}</span><span>Listening</span>`);
    }
    if (p.kind === "transcribing") show("", '<span class="spin" aria-hidden="true"></span><span>Transcribing…</span>');
    if (p.kind === "done") show("done", `${icon("check")}<span>Pasted ${p.words} ${p.words === 1 ? "word" : "words"}</span>`);
    if (p.kind === "error") show("err", `<span class="dot"></span><span class="msg">${esc(p.message)}</span>`);
    if (p.kind === "mic") show(p.live ? "rec" : "", `<span class="dot"></span><span>Mic ${p.live ? "live" : "off"} <span class="k">· ${esc(p.how)}</span></span>`);
  });
}

async function onboarding() {
  app.innerHTML = "<h1>Welcome to Myna</h1><p>What do you want to use Myna for?</p>";
  const any = () => [...form.querySelectorAll("input")].some((b) => b.checked);
  const form = await modulesForm(() => next.disabled = !any());
  const next = document.createElement("button");
  next.textContent = "Continue";
  next.disabled = !any();
  next.onclick = () => permission(0);
  app.append(form, next);
}

function permission(i) {
  const [name, reason] = PERMS[i];
  app.innerHTML = `<h1>${name}</h1><p class="reason">${reason}</p><p id="state"></p>`;
  const state = document.getElementById("state");
  const refresh = async () => {
    const ok = await invoke("permission_granted", { name });
    state.textContent = ok ? "Granted" : "Not granted yet";
    return ok;
  };
  refresh();
  window.onfocus = refresh; // System Settings grants show up when the user comes back
  const btn = (text, fn) => {
    const b = document.createElement("button");
    b.textContent = text;
    b.onclick = fn;
    app.append(b, " ");
  };
  btn(`Allow ${name}`, async () => {
    await invoke("request_permission", { name });
    setTimeout(refresh, 1500);
  });
  btn("Open System Settings", () => invoke("open_privacy_settings", { name }));
  btn(i + 1 < PERMS.length ? "Next" : "Finish", () => i + 1 < PERMS.length ? permission(i + 1) : finish());
  if (name === "Screen Recording") {
    const p = document.createElement("p");
    p.className = "reason";
    p.textContent = "macOS may need Myna to be relaunched before this shows as granted.";
    app.append(p);
  }
}

async function finish() {
  await set("onboarded", true);
  app.innerHTML = "<h1>All set</h1><p>Myna lives in your menubar.</p>";
  const done = document.createElement("button");
  done.textContent = "Done";
  window.onfocus = null;
  done.onclick = () => window.__TAURI__.window.getCurrentWindow().close();
  app.append(done);
}

// A route may carry an argument after a slash (#meetings/12); the page reads it itself.
({ "#onboarding": onboarding, "#meetings": meetings, "#pill": pill, "#popover": popover }[location.hash.split("/")[0]] || settings)();
</script>
