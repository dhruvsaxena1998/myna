name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm install
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles app
