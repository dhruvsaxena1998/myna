# Cut a release: write notes in an annotated tag and push it (see docs/RELEASING.md).
# Never runs on branch pushes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency: release

jobs:
  release:
    # macos-26 runners often never get assigned (macOS arm64 capacity). The build needs the macOS 26 SDK, not a macOS 26 host: the deployment target is 14.2.
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with the macOS 26 SDK
        # The image's default is Xcode 16.4; AppleSpeech.swift and NSGlassEffectView need the 26 SDK.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Check the tag matches the app version
        run: |
          V=${TAG#v}
          for f in "$(jq -r .version package.json)" \
                   "$(jq -r .version src-tauri/tauri.conf.json)" \
                   "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"; do
            [ "$f" = "$V" ] || { echo "::error::Tag $TAG but a version file says $f"; exit 1; }
          done
          # The updater compares semver; "beta2" sorts above every "beta.N".
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "::error::Use X.Y.Z or X.Y.Z-beta.N, not $V"; exit 1; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "$TAG")" = tag ] || { echo "::error::$TAG needs to be an annotated tag; its message is the release notes"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MYNA_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MYNA_CERT_PASSWORD }}
        run: |
          # Tauri's APPLE_CERTIFICATE import rejects self-signed certs, so import by hand and sign by name.
          KC=$RUNNER_TEMP/build.keychain-db
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.MYNA_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Updater artifacts only here, so local builds don't need the private key.
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Check the signature
        run: |
          APP=src-tauri/target/release/bundle/macos/Myna.app
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP" 2>&1 | tee /dev/stderr | grep -q 'certificate leaf = H"'
          codesign -d --entitlements - --xml "$APP" | grep -q audio-input

      - name: Publish the release
        run: |
          B=src-tauri/target/release/bundle
          V=${TAG#v}
          PRE=; [[ "$TAG" == *-beta.* ]] && PRE=--prerelease
          gh release create "$TAG" --verify-tag --notes-from-tag --title "Myna $V" $PRE \
            "$B"/dmg/*.dmg "$B/macos/Myna.app.tar.gz" "$B/macos/Myna.app.tar.gz.sig"

      - name: Update the feeds
        run: |
          B=src-tauri/target/release/bundle/macos
          V=${TAG#v}
          jq -n --arg v "$V" \
                --arg notes "$(gh release view "$TAG" --json body -q .body)" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/Myna.app.tar.gz" \
                --rawfile sig "$B/Myna.app.tar.gz.sig" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{"darwin-aarch64":{url:$url, signature:$sig}}}' > feed.json
          cat feed.json
          # A pre-release, so GitHub never shows the feeds as the Latest release while every Myna build is a beta.
          gh release view updater >/dev/null 2>&1 || \
            gh release create updater --prerelease --latest=false --title "Update feeds" --notes "Feeds the app reads to find updates. Rewritten by the release workflow; don't edit by hand."
          # Beta also gets newer stable releases; stable never sees betas.
          cp feed.json beta.json
          FILES=beta.json
          [[ "$TAG" == *-beta.* ]] || { cp feed.json stable.json; FILES="$FILES stable.json"; }
          gh release upload updater $FILES --clobber
