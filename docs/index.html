<!doctype html>
<html lang="en" data-theme="auto" data-accent="blue" data-glass="clear">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myna</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

:root {
  --desk: #D9DCE3; --win: #FFFFFF; --side: #F2F2F5; --inset: #F5F5F7; --raised: #FFFFFF; --hover: rgba(0,0,0,.05);
  --line: rgba(0,0,0,.08); --line-strong: rgba(0,0,0,.16);
  --text: #1D1D1F; --text-2: #55555B; --text-3: #6A6A70;
  --accent: #0A64D8; --on-accent: #FFFFFF; --accent-text-l: #0A5BC4; --accent-text-d: #6AAEFF; --accent-text: var(--accent-text-l);
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent); --accent-soft-strong: color-mix(in srgb, var(--accent) 20%, transparent);
  --ok: #1E7B34; --warn: #8A5300; --alert: #B3261E; --alert-soft: rgba(179,38,30,.08);
  /* Liquid Glass materials */
  --glass-base: rgba(255,255,255,.56); --glass-strong-base: rgba(250,250,252,.84); --win-glass-base: rgba(244,244,247,.70);
  --glass: var(--glass-base); --glass-strong: var(--glass-strong-base); --win-glass: var(--win-glass-base);
  --glass-edge: rgba(255,255,255,.75); --glass-line: rgba(0,0,0,.08); --glass-blur: blur(30px) saturate(180%);
  --field: rgba(0,0,0,.045); --btn-bg: rgba(255,255,255,.92); --btn-sel: #FFFFFF;
  --shadow: 0 0 0 .5px rgba(0,0,0,.14), 0 24px 64px rgba(0,0,0,.20);
  --menu-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 12px 40px rgba(0,0,0,.18);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --fs-xs: 11px; --fs-s: 12px; --fs-ui: 13px; --fs-body: 15px; --fs-h2: 15px; --fs-h1: 22px; --fs-hero: 26px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-ctl: 10px; --r-win: 26px; --r-panel: 18px; --r-pill: 980px;
  --dur: 180ms; --dur-out: 120ms; --ease-out: cubic-bezier(.28,0,.22,1); --ease-in: cubic-bezier(.5,0,.8,.3);
  --sw-blue: #0A64D8; --sw-purple: #8E44AD; --sw-pink: #C2185B; --sw-red: #C42B1C; --sw-orange: #B35000; --sw-yellow: #FFCC00; --sw-green: #1E7B34; --sw-graphite: #5E5E63;
  color-scheme: light;
}
:root[data-theme="dark"] {
    --desk: #0E0E10; --win: #1D1D1F; --side: #232326; --inset: #232325; --raised: #2C2C2E; --hover: rgba(255,255,255,.07);
    --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.18);
    --text: #ECECEF; --text-2: #B3B3B9; --text-3: #929298;
    --accent-text: var(--accent-text-d);
    --ok: #4CD964; --warn: #FFD60A; --alert: #FF6961; --alert-soft: rgba(255,105,97,.12);
    --glass-base: rgba(44,44,48,.55); --glass-strong-base: rgba(40,40,44,.82); --win-glass-base: rgba(24,24,26,.62);
    --glass-edge: rgba(255,255,255,.12); --glass-line: rgba(255,255,255,.08);
    --field: rgba(255,255,255,.07); --btn-bg: rgba(255,255,255,.10); --btn-sel: rgba(255,255,255,.18);
    --shadow: 0 0 0 .5px rgba(255,255,255,.14), 0 18px 50px rgba(0,0,0,.6);
    --menu-shadow: 0 0 0 .5px rgba(255,255,255,.14), 0 12px 40px rgba(0,0,0,.55);
    color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --desk: #0E0E10; --win: #1D1D1F; --side: #232326; --inset: #232325; --raised: #2C2C2E; --hover: rgba(255,255,255,.07);
    --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.18);
    --text: #ECECEF; --text-2: #B3B3B9; --text-3: #929298;
    --accent-text: var(--accent-text-d);
    --ok: #4CD964; --warn: #FFD60A; --alert: #FF6961; --alert-soft: rgba(255,105,97,.12);
    --glass-base: rgba(44,44,48,.55); --glass-strong-base: rgba(40,40,44,.82); --win-glass-base: rgba(24,24,26,.62);
    --glass-edge: rgba(255,255,255,.12); --glass-line: rgba(255,255,255,.08);
    --field: rgba(255,255,255,.07); --btn-bg: rgba(255,255,255,.10); --btn-sel: rgba(255,255,255,.18);
    --shadow: 0 0 0 .5px rgba(255,255,255,.14), 0 18px 50px rgba(0,0,0,.6);
    --menu-shadow: 0 0 0 .5px rgba(255,255,255,.14), 0 12px 40px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-accent="blue"] { --accent: #0A64D8; --on-accent: #FFFFFF; --accent-text-l: #0A5BC4; --accent-text-d: #6AAEFF; }
:root[data-accent="purple"] { --accent: #8E44AD; --on-accent: #FFFFFF; --accent-text-l: #8E44AD; --accent-text-d: #DA8FFF; }
:root[data-accent="pink"] { --accent: #C2185B; --on-accent: #FFFFFF; --accent-text-l: #C2185B; --accent-text-d: #FF6482; }
:root[data-accent="red"] { --accent: #C42B1C; --on-accent: #FFFFFF; --accent-text-l: #C42B1C; --accent-text-d: #FF6961; }
:root[data-accent="orange"] { --accent: #B35000; --on-accent: #FFFFFF; --accent-text-l: #B35000; --accent-text-d: #FF9F0A; }
:root[data-accent="yellow"] { --accent: #FFCC00; --on-accent: #1D1D1F; --accent-text-l: #8A6D00; --accent-text-d: #FFD60A; }
:root[data-accent="green"] { --accent: #1E7B34; --on-accent: #FFFFFF; --accent-text-l: #1E7B34; --accent-text-d: #4CD964; }
:root[data-accent="graphite"] { --accent: #5E5E63; --on-accent: #FFFFFF; --accent-text-l: #5E5E63; --accent-text-d: #C7C7CC; }
:root[data-glass="tinted"] {
  --glass: color-mix(in srgb, var(--glass-base) 82%, var(--accent));
  --glass-strong: color-mix(in srgb, var(--glass-strong-base) 90%, var(--accent));
  --win-glass: color-mix(in srgb, var(--win-glass-base) 86%, var(--accent));
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); color: var(--text); font: var(--fs-ui)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic-s { width: 14px; height: 14px; }
.ic-l { width: 20px; height: 20px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-ctl); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* window */
.stage { min-height: 100%; display: grid; place-items: center; padding: var(--s5); }
.win { width: min(1280px, 100%); height: calc(100vh - 48px); min-height: 560px; background: var(--win); border-radius: var(--r-win); box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-rows: auto minmax(0,1fr); }
.win.win-sm { width: min(760px, 100%); height: min(640px, calc(100vh - 48px)); }
.titlebar { height: 38px; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s3); border-bottom: 1px solid var(--line); background: var(--side); }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
.lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.titlebar .wt { flex: 1; text-align: center; font-weight: 600; color: var(--text-2); margin-right: 52px; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--raised); cursor: pointer; white-space: nowrap; transition: background var(--dur) var(--ease-out); }
@media (hover: hover) { .btn:hover { background: var(--hover); } .btn.primary:hover { background: #0857BD; } }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 500; }
.btn.plain { border-color: transparent; background: transparent; }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn[disabled] { opacity: .45; cursor: default; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--win); padding: 5px 8px; min-height: 28px; }
.textarea { resize: vertical; line-height: 1.5; padding: 8px; }
.input[aria-invalid="true"] { border-color: var(--alert); }
.label { font-weight: 500; }
.help { color: var(--text-3); font-size: var(--fs-s); }
.kind-h { display: block; min-height: 2lh; } /* both kinds' help fit, so switching never moves the form */
.err { color: var(--alert); font-size: var(--fs-s); display: flex; gap: 6px; align-items: flex-start; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 10px; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; background: var(--hover); color: var(--text-2); }
.pill.status { background: var(--accent-soft); color: var(--accent-text); }
.pill.alert { background: var(--alert-soft); color: var(--alert); }
.pill.ok { color: var(--ok); background: transparent; padding: 0; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--line); font-size: var(--fs-s); color: var(--text-2); white-space: nowrap; }
.tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--text-3)); flex: none; }
.tag button { border: 0; background: none; padding: 0; margin-right: -3px; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 3px; cursor: pointer; color: var(--text-3); }
@media (hover: hover) { .tag button:hover { background: var(--hover); color: var(--text); } }

.switch { appearance: none; width: 32px; height: 18px; border-radius: 9px; background: var(--line-strong); position: relative; cursor: pointer; flex: none; margin: 0; transition: background var(--dur) var(--ease-out); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform var(--dur) var(--ease-out); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(14px); }

.seg { display: inline-flex; justify-self: start; align-self: start; padding: 2px; border-radius: 7px; background: var(--hover); gap: 2px; border: 0; margin: 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px; border-radius: 5px; color: var(--text-2); }
.seg input:checked + span { background: var(--raised); color: var(--text); box-shadow: 0 0 0 .5px var(--line-strong), 0 1px 2px rgba(0,0,0,.1); font-weight: 500; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

.check { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); cursor: pointer; flex: none; }
.radio { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); cursor: pointer; flex: none; }

/* onboarding */
.ob { display: grid; grid-template-rows: minmax(0,1fr) auto; min-height: 0; }
.ob-body { padding: var(--s6) var(--s7) var(--s5); }
.ob h1 { font-size: var(--fs-hero); font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
.ob .lead { color: var(--text-2); font-size: var(--fs-body); margin-top: var(--s2); max-width: 60ch; }
.ob-foot { display: flex; align-items: center; gap: var(--s2); padding: var(--s4) var(--s7); border-top: 1px solid var(--line); }
.steps { color: var(--text-3); font-size: var(--fs-s); }
.list { margin-top: var(--s5); border: 1px solid var(--line); border-radius: 8px; background: var(--inset); }
.list > li + li { border-top: 1px solid var(--line); }
.li { display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s3) var(--s4); }
.li .glyph { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; background: var(--raised); box-shadow: 0 0 0 .5px var(--line-strong); color: var(--text-2); flex: none; }
.li-title { font-weight: 600; font-size: 14px; }
.li-desc { color: var(--text-2); margin-top: 2px; }
.li-meta { color: var(--text-3); font-size: var(--fs-s); margin-top: 4px; }
label.li { cursor: pointer; }
.task { margin-top: var(--s5); }
.task-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.task-head h2 { font-size: var(--fs-h2); font-weight: 600; }
.task-head .help { flex-basis: 100%; }
.task .list { margin-top: var(--s3); }
.mtools { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin: var(--s2) 0 var(--s1); }
.mtools-sort { display: flex; align-items: center; gap: var(--s2); }
.mgroup { margin: var(--s3) 0 var(--s1); padding: 0 var(--s4); font-size: var(--fs-s); font-weight: 600; color: var(--text-3); }
.mnone { min-height: 1.4em; margin-top: var(--s1); } /* reserved, so the page never shifts */
.model-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); }
.model-row .name { font-weight: 600; }
.model-row .vendor { color: var(--text-3); font-weight: 400; }
.dl { display: flex; align-items: center; gap: var(--s2); justify-content: flex-end; min-width: 150px; }
.dl .size { color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { width: 72px; height: 4px; border-radius: 2px; background: var(--line-strong); overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--accent); transform-origin: left; }
.cloud { display: grid; gap: var(--s3); padding: var(--s4); }
.cloud .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.errsum { margin-top: var(--s4); padding: var(--s3) var(--s4); border-radius: 8px; background: var(--alert-soft); color: var(--alert); }
.errsum ul { margin-top: 4px; padding-left: 18px; list-style: disc; }
.errsum a { color: inherit; }
.kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; font-size: var(--fs-s); font-weight: 600; }

/* app shell */
.app { display: grid; grid-template-columns: 228px minmax(0,1fr); min-height: 0; position: relative; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: var(--s3) var(--s2); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.side h2 { font-size: var(--fs-xs); font-weight: 600; color: var(--text-3); padding: var(--s4) var(--s2) var(--s1); }
.nav { display: flex; align-items: center; gap: var(--s2); width: 100%; height: 28px; padding: 0 var(--s2); border-radius: var(--r-ctl); border: 0; background: none; cursor: pointer; text-align: left; color: var(--text); }
.nav .ic { color: var(--text-2); }
.nav .count { margin-left: auto; color: var(--text-3); font-size: var(--fs-s); font-variant-numeric: tabular-nums; }
@media (hover: hover) { .nav:hover { background: var(--hover); } }
.nav[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
.nav[aria-current="true"] .ic, .nav[aria-current="true"] .count { color: var(--on-accent); }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; margin: 0 4px; }
.side-foot { margin-top: auto; padding: var(--s4) var(--s2) var(--s1); display: grid; gap: var(--s2); color: var(--text-3); font-size: var(--fs-s); }
.newfolder { padding: 2px var(--s2); }

.main { display: grid; grid-template-rows: auto minmax(0,1fr); min-height: 0; min-width: 0; }
.toolbar { display: flex; align-items: center; gap: var(--s2); height: 48px; padding: 0 var(--s4); border-bottom: 1px solid var(--line); }
.toolbar h1 { font-size: 15px; font-weight: 600; }
.toolbar .grow { flex: 1; }
.menu-btn { display: none; }

/* meetings list */
.mlist { overflow-y: auto; }
.mrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); cursor: pointer; }
@media (hover: hover) { .mrow:hover { background: var(--hover); } }
.mrow .t { font-weight: 600; font-size: 14px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.mrow .meta { color: var(--text-3); font-size: var(--fs-s); margin-top: 2px; }
.mrow .tags { margin-top: 6px; --od-gap: 6px; }
.mrow .folder { color: var(--text-3); font-size: var(--fs-s); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.listhead { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); color: var(--text-3); font-size: var(--fs-s); }
.empty { display: grid; place-items: center; text-align: center; padding: var(--s7) var(--s5); color: var(--text-2); gap: var(--s2); }
.empty h2 { font-size: var(--fs-h2); color: var(--text); }
.empty p { max-width: 42ch; }

/* detail */
.detail { overflow-y: auto; min-height: 0; padding: var(--s5) var(--s6) var(--s7); }
.sec-h { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
.doc-head h1 { font-size: var(--fs-h1); font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
.doc-head .meta { color: var(--text-2); margin-top: 4px; }
.tagedit { margin-top: var(--s3); --od-gap: 6px; }
.tagedit input { width: 120px; height: 22px; min-height: 22px; padding: 0 6px; font-size: var(--fs-s); }
.seg-row { display: grid; grid-template-columns: 112px minmax(0,1fr); gap: var(--s4); padding: var(--s2) 0; }
.seg-who { text-align: right; padding-top: 2px; }
.seg-who b { display: block; font-weight: 600; }
.seg-who time { display: block; color: var(--text-3); font-size: var(--fs-s); font-variant-numeric: tabular-nums; }

const NERD_TODAY = new Date(2025, 9, 29);

/* shortcut: keyword match over title, tags, folder, speakers, transcript and summary; the real app would use embeddings */
const STOP = new Set('the and for with about what who whom which when where why how did does was were are our you they this that these those from any all every list show tell give summary summarize decide decided decision decisions agree agreed action actions item items todo todos next step steps said say says spoke speak speaker most meeting meetings call calls ask asked have has had can could would should there their them its into been'.split(' '));

    return [m.id, words.filter(w => hay.includes(w)).length];

/* ---------- app updates ---------- */
const UPD_EVERY = { launch:['At launch and daily', 'Checks each time Myna opens, and once a day while it’s open.'], day:['Daily', 'Checks once a day, even if you quit and reopen Myna.'], week:['Weekly', 'Checks once a week, even if you quit and reopen Myna.'] };
const UPD_MODES = { auto:['Check and download', 'Checks on its own, downloads in the background, then asks you to restart.'], check:['Check only', 'Checks on its own and tells you when there’s an update. You choose when to download.'], off:['Off', 'Never checks on its own. Use Check for updates when you want to.'] };
const UPD_NOTES = `<h2>What’s new</h2>
  <h3>Dictation</h3><ul><li>Your words now appear faster after you let go of the key.</li><li>Fixed the pill covering the Dock on some displays.</li></ul>
  <h3>Meetings</h3><ul><li>Notes keep the speaker names you fix in the transcript.</li><li>Zoom detection works again after Zoom updates.</li></ul>
  <h3>Fixes</h3><ul><li>Settings no longer jump when a model finishes downloading.</li></ul>
  <p style="margin-top:var(--s3)"><a href="https://github.com/dhruvsaxena1998/myna/releases" target="_blank" rel="noopener">Full changelog on GitHub</a> · <span class="help">Sample data</span></p>`;
const updBusy = () => S.u.busy || S.rec.state === 'rec' || S.dictS.state === 'rec';
const updPaint = () => render();
function updSlot() {
  const U = S.u, st = U.state;
  return `<div class="upd-st">${{
    checking:`<span class="pill status" role="status">Checking…</span>`,
    available:`<button class="btn" id="upd-row" data-act="upd-open">Update available · ${UPD_NEXT}</button>`,
    downloading:`<span class="pill status" role="status">Downloading ${U.pct}%</span>`,
    downloaded:`<button class="btn" id="upd-row" data-act="upd-open">Restart to update</button>`,
    restarting:`<span class="pill status" role="status">Restarting…</span>`,
    error:`<span class="pill alert">Update failed</span><button class="btn" id="upd-row" data-act="upd-check">Try again</button>`
  }[st] || `<button class="btn" id="upd-row" data-act="upd-check">Check for updates</button>`}</div>`;
}
function updCheck() {   // manual check: opens the pop-up straight away with the result
  const U = S.u; U.state = 'checking'; U.open = false; updPaint();
  setTimeout(() => { if (U.state !== 'checking') return; U.state = U.ver === UPD_NEXT ? 'uptodate' : 'available'; U.open = true; updPaint(); $('#upd-primary')?.focus(); }, 900);
}
function updNotify(kind) {   // one notification per version
  if (S.u.seen[UPD_NEXT]) return;
  S.u.seen[UPD_NEXT] = true; S.u.toast = kind;
}
function updDownload(quiet) {
  const U = S.u; clearInterval(U.timer); U.state = 'downloading'; U.pct = 0; updPaint();
  U.timer = setInterval(() => {
    U.pct = Math.min(100, U.pct + 7);
    if (U.pct < 100) return updPaint();
    clearInterval(U.timer);
    if (quiet) { U.state = 'downloaded'; updNotify('ready'); }
    else if (updBusy()) U.state = 'downloaded';
    else return updRestart();
    updPaint();
  }, 150);
}
function updRestart() {
  const U = S.u; U.state = 'restarting'; U.toast = null; U.open = true; updPaint();
  setTimeout(() => { U.ver = UPD_NEXT; U.state = 'idle'; U.open = false; updPaint(); $('#upd-row')?.focus(); }, 1500);
}
function updClose() {
  const U = S.u; U.open = false; if (U.state === 'uptodate') U.state = 'idle';
  updPaint(); $('#upd-row')?.focus();
}
function updSim(k) {
  const U = S.u;
  if (k === 'recording') { U.busy = !U.busy; return updPaint(); }
  if (k === 'found' && S.set.updMode === 'off') return;
  clearInterval(U.timer); Object.assign(U, { state:'idle', open:false, pct:0, toast:null, bad:false, err:'' });
  if (k === 'found') { U.ver = UPD_CUR; U.seen = {}; S.set.updMode === 'check' ? (U.state = 'available', updNotify('avail')) : updDownload(true); }
  if (k === 'error') Object.assign(U, { state:'error', open:true, err:'Couldn’t reach GitHub. Check your connection.' });
  if (k === 'badsig') Object.assign(U, { state:'error', open:true, bad:true, err:'This update failed its security check and wasn’t installed.' });
  if (k === 'uptodate') Object.assign(U, { state:'uptodate', open:true, ver:UPD_CUR });
  updPaint(); if (U.open) $('#upd-primary, #upd-later')?.focus();
}
function updPopup() {
  const U = S.u, st = U.state, busy = updBusy();
  const ok = st === 'uptodate', err = st === 'error', dl = st === 'downloading', rs = st === 'restarting';
  const title = ok ? 'Myna is up to date' : err ? (U.bad ? 'Update not installed' : 'Couldn’t check for updates') : `Myna ${UPD_NEXT} is available`;
  const sub = ok ? `You’re on the latest version (${U.ver})` : err ? `<span style="color:var(--alert)">${U.err}</span>` : `You have ${U.ver} · ${S.set.channel === 'beta' ? 'Beta' : 'Stable'}`;
  const later = (l = 'Later') => `<button class="btn" id="upd-later" data-act="upd-close">${l}</button>`;
  const foot = rs ? `<span class="help" role="status">Restarting…</span>`
    : dl ? `<div class="bar upd-bar" role="progressbar" aria-label="Downloading update" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${U.pct}"><b style="transform:scaleX(${U.pct / 100})"></b></div><span class="help od-nowrap" style="min-width:4ch;text-align:right;font-variant-numeric:tabular-nums">${U.pct}%</span><button class="btn" id="upd-primary" data-act="upd-cancel">Cancel</button>`
    : `<span class="od-fill">${st === 'downloaded' && busy ? `<span class="help" id="upd-busy">Finish recording first</span>` : ''}</span>` + (ok ? `<button class="btn primary" id="upd-primary" data-act="upd-close">OK</button>`
      : err ? later('Close') + (U.bad ? '' : `<button class="btn primary" id="upd-primary" data-act="upd-check">Try again</button>`)
      : later() + (st === 'downloaded' ? `<button class="btn primary" id="upd-primary" data-act="upd-restart" ${busy ? 'disabled title="Finish recording first" aria-describedby="upd-busy"' : ''}>Restart now</button>` : `<button class="btn primary" id="upd-primary" data-act="upd-dl">Download and restart</button>`));
  return `<div class="upd-scrim"><div class="win win-sm win-upd" role="dialog" aria-modal="true" aria-labelledby="upd-h">
    <div class="titlebar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><div class="wt">Software update</div></div>
    <div class="ob"><div class="upd-body"><h1 id="upd-h">${title}</h1><p class="lead" style="margin-top:var(--s1)">${sub}</p>${ok || err ? '' : `<div class="upd-notes" tabindex="0" aria-label="What’s new">${UPD_NOTES}</div>`}</div>
      <div class="ob-foot">${foot}</div></div></div></div>`;
}

    el.setAttribute('aria-invalid', S.tasks[k].keyErr ? 'true' : 'false');
    $('#key-' + k + '-e').innerHTML = S.tasks[k].keyErr ? icon('alert','ic-s') + esc(S.tasks[k].keyErr) : ''; }
  if (el.id === 'nf' && !el.value.trim()) setTimeout(() => { if (S.addingFolder) { S.addingFolder = false; render(); } }, 0);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === 'folder') {
    const name = $('#nf').value.trim().slice(0, 32);
    if (name && !S.folders.some(x => x.toLowerCase() === name.toLowerCase())) S.folders.push(name);
    S.addingFolder = false; render();
  }
  if (kind === 'tag') {
    const v = $('#newtag').value.trim().toLowerCase().slice(0, 20), m = byId(f.dataset.id);
    if (v && !m.tags.includes(v)) m.tags.push(v);
    render(); $('#newtag').focus();
  }
  if (kind === 'regen') {
    if (document.activeElement?.id === 'tplname') { saveTpl(); return; }   // Enter in the name field saves, not regenerates
    const m = byId(f.dataset.id), mode = S.regen.mode, tpl = mode === 'custom' ? 't-summary' : S.regen.tpl;
    if (!mode) return;
    const p = mode === 'custom' ? S.regen.draft.trim() : S.templates.find(t => t.id === tpl).prompt;
    if (!p) { $('#prompt-e').innerHTML = icon('alert','ic-s') + 'Write what you want first, or pick a template.'; $('#prompt').setAttribute('aria-invalid','true'); $('#prompt').focus(); return; }
    S.sums[m.id] = { ...S.sums[m.id], loading:true }; S.pop = null; render();
    setTimeout(() => { S.sums[m.id] = { ...generate(m, tpl, p), ...(mode === 'custom' ? { custom:true } : {}) }; if (S.current === m.id) render(); $('#regen-btn')?.focus(); }, 1400);
  }
  if (kind === 'dict') addDict($('#dict-in').value);
  if (kind === 'keep') { $('#keep-in').value.split(',').map(w => w.trim().toLowerCase().slice(0, 40)).filter(Boolean).forEach(w => { if (!S.set.keep.includes(w)) S.set.keep.push(w); }); render(); $('#keep-in').focus(); }
  if (kind === 'ai-add') {
    if (!validateAdd()) { render(); $('[aria-invalid=true]').focus(); return; }
    const a = S.ai.add, id = 'p' + Date.now();
    S.ai.providers.push({ id, preset:a.preset, name:a.name.trim(), url:a.url.trim(), key:a.key.trim() });
    S.ai.add = null; render(); $(`[data-act=ai-test][data-id="${id}"]`).focus();
  }
  if (kind === 'chat') { const ta = f.querySelector('textarea'); send(f.dataset.key, ta.value); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('tr[data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (S.hkRec) {
    e.preventDefault(); e.stopPropagation();
    if (e.key === 'Escape') { const p = S.hkRec; S.hkRec = false; render(); $('#hk-' + p)?.focus(); return; }
    if (MOD_SIDE[e.code]) { S.hkMod = MOD_SIDE[e.code]; return; }   // wait: modifier alone or part of a combo
    const mods = [e.ctrlKey && '⌃', e.altKey && '⌥', e.shiftKey && '⇧', e.metaKey && '⌘'].filter(Boolean);
    hkSave([...mods, hkKeyName(e)].join('+'));
    return;
  }
  const typing = e.target.matches('input, textarea, select, [contenteditable]');
  if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && (S.view === 'meetings' || S.view === 'clips')) {
    e.preventDefault(); const f = $(S.view === 'clips' ? '#clipq' : '#mq'); if (f) { f.focus(); f.select(); } return;
  }
  if (e.key === 'Escape' && (e.target.id === 'mq' || e.target.id === 'clipq') && e.target.value) {
    S[e.target.id === 'mq' ? 'mq' : 'clipQ'] = ''; render(); document.getElementById(e.target.id).focus(); return;
  }
  if (e.key === 'Backspace' && e.target.id === 'dict-in' && !e.target.value && S.set.dict.length) { S.set.dict.pop(); render(); $('#dict-in').focus(); return; }
  if (S.view !== 'onboarding') {
    const mk = S.set.meetKey;
    if (e.ctrlKey && e.altKey && ((mk === 'ctrl-opt-m' && e.code === 'KeyM') || (mk === 'ctrl-opt-n' && e.code === 'KeyN'))) {
      e.preventDefault(); if (S.dictS.state === 'rec') S.dictS = { state:null };
      S.rec.state === 'rec' ? stopRec() : startRec(); return;
    }
    // shortcut: the browser cannot see fn, so holding Option stands in for the dictation hotkey
    if (e.key === 'Alt' && !e.repeat && !e.ctrlKey && !e.metaKey && S.set.mode === 'hold') startDict(true);
    else if (e.key !== 'Alt' && S.dictS.state === 'rec' && S.dictS.hold) { S.dictS = { state:null }; renderOverlay(); }
    if (S.mb.open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const items = [...document.querySelectorAll('.mbpop .mitem:not([disabled])')], i = items.indexOf(document.activeElement);
      items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus(); return;
    }
  }
  if (typeof S.pop === 'string' && S.pop.startsWith('pick-') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const items = [...document.querySelectorAll('#pk-list .mitem:not([disabled])')], i = items.indexOf(document.activeElement);
    (i < 0 ? items[e.key === 'ArrowDown' ? 0 : items.length - 1] : items[i + (e.key === 'ArrowDown' ? 1 : -1)] || $('#pk-q'))?.focus(); return;
  }
  if (e.metaKey && e.key === ',' && S.view !== 'onboarding') { e.preventDefault(); go('settings'); return; }
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches('.composer textarea')) { e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.key === 'Escape') {
    if (S.u.open) { updClose(); return; }
    if (S.mb.open) { S.mb.open = false; renderOverlay(); $('#mb-btn').focus(); return; }
    if (S.detect.menu) { S.detect.menu = false; renderOverlay(); $('#det-more')?.focus(); return; }
    if (S.dictS.state === 'rec') { S.dictS = { state:null }; renderOverlay(); return; }
    if (S.rec.open) { S.rec.open = false; renderOverlay(); $('#rec-pill')?.focus(); return; }
    if (S.pop) {
      const p = S.pop; S.pop = null; render();
      $(typeof p === 'object' ? `[data-act=side-menu][data-kind=${p.kind}][data-v="${CSS.escape(p.v)}"]` : p === 'move' ? '#move-btn' : p === 'data' ? '#data-btn' : p.startsWith('pick-') ? '#' + p : '#regen-btn')?.focus(); return;
    }
    if (S.panel && S.view === 'detail') { const p = S.panel; S.panel = null; render(); $(`.toolbar [data-act=panel][data-p=${p}]`)?.focus(); return; }
    if (S.drawer) { S.drawer = false; render(); return; }
    if (S.addingFolder) { S.addingFolder = false; render(); }
  }
});

document.addEventListener('keyup', e => {
  if (S.hkRec) { if (S.hkMod && MOD_SIDE[e.code] === S.hkMod) hkSave(S.hkMod); return; }
  if (e.key !== 'Alt' || S.view === 'onboarding') return;
  if (S.dictS.state === 'rec' && S.dictS.hold) stopDict();
  else if (S.set.mode === 'toggle' && !e.ctrlKey && !e.metaKey) S.dictS.state === 'rec' ? stopDict() : startDict(false);
});

// deep links from flow.html, e.g. index.html#settings/about or #onboarding/models
(function () {
  const [v, a] = decodeURIComponent(location.hash.slice(1)).split('/'); if (!v) return;
  if (v === 'onboarding') { S.step = Math.max(0, STEPS.indexOf(a)); return; }
  Object.assign(S.perms, { mic:true, ax:true, screen:true });
  S.view = ['meetings', 'detail', 'chat', 'clips', 'settings', 'yours', 'nerds'].includes(v) ? v : 'meetings';
  if (v === 'nerds') { S.set.expOn = true; S.set.exp.nerds = true; }
  if (v === 'detail') { S.current = byId(a) ? a : MEETINGS[0].id; if (a === 'transcript' || a === 'chat') S.panel = a; }
  if (v === 'settings' && a) S.setPage = a;
  if (v === 'settings' && location.hash.endsWith('/sample')) aiSample();   // #settings/ai/sample
  if (v === 'record') setTimeout(() => { startRec(); if (a === 'live') { S.rec.open = true; renderOverlay(); } }, 0);
  if (v === 'detected') setTimeout(() => { S.detect.state = 'shown'; renderOverlay(); }, 0);
  if (v === 'menu') setTimeout(() => { S.mb.open = true; renderOverlay(); }, 0);
  if (v === 'voice') setTimeout(() => startDict(false), 0);
  if (v === 'update') { S.view = 'settings'; S.setPage = 'about'; setTimeout(() => updSim(a), 0); }   // #update/found | error | badsig | uptodate | recording
})();
render();
</script>
</body>
