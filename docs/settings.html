<!doctype html>
<html lang="en" data-theme="dark" data-accent="blue" data-glass="clear">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myna Settings · prototype</title>
<link rel="stylesheet" href="../design/tokens.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg-desk); }
  button, input, select, textarea { font: inherit; color: inherit; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
  input, textarea { caret-color: var(--accent); }

  /* Window: 880×520 by default, drag the corner down to 640×420. */
  .window { width: 880px; height: 520px; min-width: 640px; min-height: 420px; max-width: 96vw; max-height: 92vh; resize: both; overflow: hidden;
    display: grid; grid-template-columns: var(--w-settings-nav) minmax(0, 1fr); gap: var(--win-inset); padding: var(--win-inset);
    border-radius: var(--r-2xl); background: var(--mat-window); box-shadow: var(--shadow-window); }

  /* Sidebar */
  .side { border-radius: var(--r-xl); background: var(--mat-sidebar); box-shadow: inset 0 0 0 .5px var(--edge); display: flex; flex-direction: column; min-height: 0; }
  .lights { height: var(--h-titlebar); display: flex; gap: var(--sp-2); align-items: center; padding: 0 var(--sp-4); flex: none; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--label-red); box-shadow: inset 0 0 0 .5px var(--line-strong); }
  .lights i:nth-child(2) { background: var(--label-yellow); } .lights i:nth-child(3) { background: var(--label-green); }
  .nav { list-style: none; margin: 0; padding: 0 var(--sp-2) var(--sp-2); outline: none; overflow: auto; }
  .nav:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; border-radius: var(--r-md); }
  .cap { margin: var(--sp-4) 0 var(--sp-1); padding: 0 10px; font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-semibold); color: var(--text-3); }
  .cap:first-child { margin-top: 0; }
  .gap { height: var(--sp-4); }
  .nav li[role="option"] { height: var(--h-row); display: flex; align-items: center; gap: var(--sp-2); padding: 0 10px; border-radius: var(--r-md); cursor: default;
    transition: background-color var(--dur-fast) var(--ease-in); }
  .nav li[role="option"]:hover { background: var(--fill-hover); }
  .nav li[aria-selected="true"] { background: var(--accent-soft-strong); font-weight: var(--fw-medium); }
  .nav .ic { color: var(--text-2); }
  .nav li[aria-selected="true"] .ic { color: var(--accent-text); }

  .ic { width: var(--ic); height: var(--ic); flex: none; fill: none; stroke: currentColor; stroke-width: var(--ic-stroke); stroke-linecap: round; stroke-linejoin: round; }

  /* Main panel */
  main { container-type: inline-size; min-width: 0; min-height: 0; border-radius: var(--r-xl); background: var(--bg-content); display: flex; flex-direction: column; overflow: hidden; }
  :root[data-liquid] main { box-shadow: inset 0 0 0 .5px var(--edge); }
  .toolbar { height: var(--h-toolbar); flex: none; display: flex; align-items: center; gap: var(--sp-1); padding: 0 var(--sp-5); }
  .toolbar h1 { margin: 0; font-size: var(--fs-title2); line-height: var(--lh-title2); font-weight: var(--fw-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Signature: the page head on Listen, Understand and Write is the path your voice takes, each stage with what it does now. */
  .head { height: auto; min-height: 44px; padding: var(--sp-1) var(--sp-5); }
  .head + .scroll .page { padding-top: var(--sp-3); }
  .strip { display: flex; align-items: flex-start; min-width: 0; overflow: hidden; }
  .stage { display: flex; flex-direction: column; align-items: flex-start; flex: none; gap: 0; padding: 2px var(--sp-2); margin: 0 calc(-1 * var(--sp-2)); border: 0; border-radius: var(--r-sm); background: none; text-align: left;
    transition: background-color var(--dur-fast) var(--ease-in); }
  .stage:hover { background: var(--fill-hover); }
  .stage .sn { font-size: var(--fs-body); line-height: var(--lh-body); font-weight: var(--fw-medium); color: var(--text-2); white-space: nowrap; }
  .stage[aria-current="step"] .sn { color: var(--accent-text); }
  .stage.off .sn { color: var(--text-3); }
  .stage .sv { display: flex; align-items: center; gap: var(--sp-1); min-height: var(--lh-footnote); font-size: var(--fs-footnote); line-height: var(--lh-footnote); color: var(--text-3);
    white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
  .stage .sv kbd { height: 16px; min-width: 16px; padding: 0 4px; }
  .stage .sv .ok { color: inherit; } .stage .sv .ok .ic { width: 12px; height: 12px; }
  .stage .sv .pill { height: 16px; padding: 0 6px; }
  .link { flex: none; width: 16px; height: .5px; margin: 11px var(--sp-2) 0; background: var(--line-strong); }
  .link.off { background: none; border-top: .5px dashed var(--line-strong); }
  .hnav { display: flex; gap: 2px; margin: 0 var(--sp-2) 0 -8px; flex: none; }
  .hnav .btn { width: 28px; height: 28px; }
  .hnav .btn { color: var(--text); }
  .hnav .btn:disabled { color: var(--text-disabled); }
  .stage:last-child { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .stage:last-child .sv { max-width: 100%; }
  .stage .clip { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sv.fresh { animation: fresh 900ms var(--ease-out); }
  @keyframes fresh { from { color: var(--accent-text); } }

  /* Page */
  .scroll { flex: 1; min-height: 0; overflow: auto; container-type: inline-size; }
  .page { display: flex; flex-direction: column; gap: var(--sp-5); padding: 0 var(--sp-5) var(--sp-6); }
  .page.enter { animation: enter var(--dur) var(--ease-out); }
  @keyframes enter { from { opacity: 0; transform: translateY(4px); } }
  section { position: relative; margin: 0; }
  h2 { margin: 0 0 var(--sp-2); font-size: var(--fs-body); line-height: var(--lh-body); font-weight: var(--fw-semibold); color: var(--text-2); }
  .help { margin: calc(-1 * var(--sp-1)) 0 var(--sp-2); font-size: var(--fs-footnote); line-height: var(--lh-footnote); color: var(--text-3); }
  /* An error hangs in the 24px gap under its own list: 4px, a 16px line, 4px. It never pushes anything. */
  .err { position: absolute; left: var(--sp-4); right: 0; top: calc(100% + var(--sp-1)); margin: 0; font-size: var(--fs-footnote); line-height: var(--lh-footnote); color: var(--danger-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .err.okmsg { color: var(--text-2); }

  .list { list-style: none; margin: 0; padding: 0; border-radius: var(--r-xl); background: var(--bg-inset); box-shadow: inset 0 0 0 .5px var(--line); }
  .row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; min-height: 60px; padding: var(--sp-3) var(--sp-4); }
  .row + .row::before, .row + .stage-row::before, .stage-row + .row::before { content: ""; position: absolute; top: 0; left: var(--sp-4); right: 0; height: 1px; background: var(--line); }
  .row.go { cursor: default; } .row.go:hover { background: var(--fill-hover); }
  .list > .row:first-child { border-radius: var(--r-xl) var(--r-xl) 0 0; } .list > .row:last-child { border-radius: 0 0 var(--r-xl) var(--r-xl); } .list > .row:only-child { border-radius: var(--r-xl); }
  .txt { min-width: 0; }
  .name { display: flex; align-items: center; gap: var(--sp-2); font-weight: var(--fw-medium); min-width: 0; }
  .name > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-weight: var(--fw-regular); font-size: var(--fs-footnote); color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .desc { display: block; margin-top: 2px; font-size: var(--fs-footnote); line-height: var(--lh-footnote); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc.bad { color: var(--danger-text); }
  .end { display: flex; align-items: center; gap: var(--sp-2); justify-content: flex-end; }
  .chev { color: var(--text-3); }
  .mono { font-family: var(--font-mono); font-size: var(--fs-footnote); user-select: text; -webkit-user-select: text; cursor: text; }
  .count { color: var(--text-3); font-variant-numeric: tabular-nums; }

  /* Controls */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1h); height: var(--h-ctl); padding: 0 14px; border: 0; border-radius: var(--r-full);
    background: var(--fill-control); color: var(--text); box-shadow: inset 0 0 0 .5px var(--line-strong), var(--shadow-control); white-space: nowrap;
    transition: background-color var(--dur-fast) var(--ease-in), transform var(--dur-fast) var(--ease-in); }
  .btn:hover:not(:disabled) { background: color-mix(in srgb, var(--fill-control) 85%, var(--text)); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { color: var(--text-disabled); }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: var(--fw-medium); box-shadow: var(--shadow-control); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn.danger { background: var(--danger); color: var(--on-solid); font-weight: var(--fw-medium); box-shadow: var(--shadow-control); }
  .btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 88%, var(--on-solid)); }
  .btn.plain { background: none; box-shadow: none; padding: 0 10px; color: var(--text-2); }
  .btn.plain:hover:not(:disabled) { background: var(--fill-hover); }
  .btn.icon { width: var(--h-ctl); padding: 0; }
  .btn.sm { height: var(--h-ctl-sm); padding: 0 10px; }
  .btn.rec { box-shadow: inset 0 0 0 2px var(--focus-ring); color: var(--text-2); }

  kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: var(--r-xs); background: var(--fill-field);
    box-shadow: inset 0 0 0 .5px var(--line-strong); font: var(--fs-footnote)/1 var(--font); color: var(--text); }
  .keys { display: inline-flex; gap: 3px; }

  .switch { appearance: none; width: 38px; height: 22px; margin: 0; border-radius: 11px; position: relative; flex: none; background: var(--fill-track);
    transition: background-color var(--dur) var(--ease-out); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--fill-control-on);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform var(--dur) var(--ease-out); }
  :root:not([data-theme="dark"]) .switch::after { background: #fff; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(16px); background: #fff; }
  .switch:disabled { opacity: .45; }

  /* Segmented control: equal segments, the raised thumb is the only cue. */
  .seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin: 0; padding: 3px; border: 0; border-radius: var(--r-full); background: var(--fill-field); }
  .seg label { position: relative; }
  .seg input { position: absolute; inset: 0; margin: 0; opacity: 0; }
  .seg span { display: grid; place-items: center; height: 24px; padding: 0 14px; border-radius: var(--r-full); color: var(--text-2); white-space: nowrap;
    transition: background-color var(--dur-fast) var(--ease-in), color var(--dur-fast) var(--ease-in); }
  .seg input:checked + span { background: var(--fill-control-on); color: var(--text); box-shadow: 0 0 0 .5px var(--line-strong), 0 1px 2px rgba(0, 0, 0, .1); }
  .seg input:focus-visible + span { outline: 2px solid var(--focus-ring); outline-offset: 1px; }

  .select:focus-visible, .input:focus-visible, .switch:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .input { height: var(--h-ctl); width: 100%; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-md); background: var(--fill-field); box-shadow: inset 0 0 0 .5px var(--line-strong); }
  .input::placeholder, textarea::placeholder { color: var(--text-3); }
  .input[aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--danger); }
  textarea.input { height: 96px; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-lg); resize: none; line-height: var(--lh-body); }
  .search { border-radius: var(--r-full); padding-left: 32px; background: var(--fill-field) no-repeat 12px center; }
  .search-wrap { position: relative; } .search-wrap .ic { position: absolute; left: 11px; top: 7px; color: var(--text-3); }

  .pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--r-full); font-size: var(--fs-caption); line-height: var(--lh-caption);
    font-weight: var(--fw-semibold); white-space: nowrap; background: var(--fill-hover); color: var(--text-2); }
  .pill.status { background: var(--accent-soft); color: var(--accent-text); }
  .pill.caution { background: var(--caution-soft); color: var(--caution-text); }

  .ok { display: inline-flex; align-items: center; gap: var(--sp-1); color: var(--text-2); white-space: nowrap; }
  .ok .ic { color: var(--ok); stroke-width: 2; width: var(--ic-sm); height: var(--ic-sm); }
  .state { min-width: 164px; display: flex; justify-content: flex-end; }

  /* Highlight colour */
  .swatches { display: flex; gap: var(--sp-1); }
  .sw { width: 24px; height: 24px; border: 0; padding: 0; border-radius: 50%; background: none; display: grid; place-items: center; }
  .sw::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 .5px var(--line-strong); }
  .sw[aria-checked="true"]::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--on); }
  .sw { position: relative; }

  /* Slider */
  .slider { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-3); }
  .range { appearance: none; width: 160px; height: 20px; margin: 0; background: none; --v: 50%; }
  .range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--accent), var(--accent)) 0 / var(--v) 100% no-repeat, var(--fill-track); }
  .range::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .5px var(--line-strong), 0 1px 4px rgba(0, 0, 0, .35); }
  .slider:has(.range:disabled) { opacity: .45; }

  /* Pill preview: a stand-in screen with the pill where it will show. Fixed height, so switching never moves the page. */
  .stage-row { position: relative; height: 128px; margin: 0 var(--sp-3) var(--sp-3); border-radius: var(--r-md); background: var(--fill-field); box-shadow: inset 0 0 0 .5px var(--line); overflow: hidden; list-style: none; }
  .hud { position: absolute; display: flex; align-items: center; gap: var(--sp-2); color: var(--hud-fg); background: var(--hud-bg); box-shadow: var(--shadow-hud), inset 0 0 0 .5px var(--hud-edge);
    transition: top var(--dur) var(--ease-out), left var(--dur) var(--ease-out); font-size: var(--fs-footnote); white-space: nowrap; }
  .hud.capsule { height: 32px; padding: 0 14px 0 10px; border-radius: 16px; }
  .hud.orb { width: 28px; height: 28px; border-radius: 50%; justify-content: center; }
  .hud.wave { height: 34px; padding: 0 12px; border-radius: 17px; }
  .hud.card { height: 44px; padding: 0 14px; border-radius: 14px; }
  .hud .bars { display: flex; gap: 2px; align-items: center; height: 14px; }
  .hud .bars i { width: 2px; border-radius: 1px; background: currentColor; }
  .hud .t2 { display: grid; line-height: 14px; } .hud .t2 small { opacity: .7; font-size: var(--fs-caption); }
  .hud .tm { font-variant-numeric: tabular-nums; opacity: .8; }
  .ring { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px currentColor; opacity: .9; }

  /* Model rows on the drill-in: name, one line, then ratings and download state on one line. */
  .mrow { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); position: relative; min-height: 60px; }
  .mstate { min-width: 136px; }
  .mrow + .mrow::before { content: ""; position: absolute; top: 0; left: 48px; right: 0; height: 1px; background: var(--line); }
  .mrow input[type="radio"] { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }
  .bar { width: 96px; height: 4px; border-radius: 2px; background: var(--fill-track); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
  .pct { font-size: var(--fs-footnote); color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
  .none { margin: 0; min-height: var(--lh-footnote); font-size: var(--fs-footnote); color: var(--text-3); }

  /* Word chips */
  .chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); align-items: center; min-height: 60px; }
  .tag { display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 4px 0 10px; border-radius: var(--r-full); background: var(--fill-field); box-shadow: inset 0 0 0 .5px var(--line); }
  .tag button { width: 18px; height: 18px; display: grid; place-items: center; border: 0; padding: 0; border-radius: 50%; background: none; color: var(--text-3); }
  .tag button:hover { background: var(--fill-hover); color: var(--text); }
  .tag .ic { width: 12px; height: 12px; }
  .chips input { flex: 1 1 140px; min-width: 120px; height: 24px; border: 0; background: none; outline: none; padding: 0 var(--sp-1); }

  /* Forms on drill-ins */
  .field { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--sp-1) var(--sp-4); align-items: start; padding: var(--sp-3) var(--sp-4); position: relative; }
  .field + .field::before { content: ""; position: absolute; top: 0; left: var(--sp-4); right: 0; height: 1px; background: var(--line); }
  .field.one { min-height: 60px; align-items: center; }
  .field > label { font-weight: var(--fw-medium); line-height: var(--h-ctl); }
  .field .fh { grid-column: 2; min-height: var(--lh-footnote); font-size: var(--fs-footnote); line-height: var(--lh-footnote); color: var(--text-3); }
  .field .fh.bad { color: var(--danger-text); }
  .actions { display: flex; justify-content: flex-end; gap: var(--sp-2); }
  .steps { margin: 0; padding-left: 18px; font-size: var(--fs-footnote); line-height: var(--lh-footnote); color: var(--text-2); display: grid; gap: 2px; }

  /* Empty states: a heading, one sentence, one action. */
  .empty { display: grid; justify-items: start; gap: var(--sp-1); padding: var(--sp-4); }
  .empty b { font-weight: var(--fw-semibold); }
  .empty p { margin: 0 0 var(--sp-2); color: var(--text-2); font-size: var(--fs-footnote); line-height: var(--lh-footnote); }
  .foot { margin: 0; font-size: var(--fs-footnote); line-height: var(--lh-footnote); color: var(--text-3); }
  .foot a { color: var(--accent-text); text-decoration: none; } .foot a:hover { text-decoration: underline; text-underline-offset: 2px; }

  /* Narrow window: the trailing control drops under its text. */
  @container (width < 460px) { .link { width: 8px; margin-inline: var(--sp-1h); } }
  @container (width < 480px) {
    .row.wide { grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); }
    .row.wide .end { justify-content: flex-start; }
    .row .state { min-width: 0; }
    .desc { white-space: normal; }
    .field { grid-template-columns: minmax(0, 1fr); } .field .fh { grid-column: 1; } .field > label { line-height: var(--lh-body); }
    .page { padding: 0 var(--sp-4) var(--sp-6); }
  }

  /* Prototype controls: not part of the design. */
  .proto { position: fixed; bottom: 12px; left: 12px; z-index: 9; display: grid; gap: 6px; padding: 10px 12px; width: 200px; border-radius: 10px; font: 12px/16px var(--font-mono);
    background: var(--bg-raised); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line-strong); border: 1px dashed var(--line-strong); }
  .proto label { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px; }
  .proto select { font: inherit; height: 22px; border-radius: 6px; border: 0; background: var(--fill-field); padding: 0 4px; }
  .proto p { margin: 0; color: var(--text-3); }
  :root[data-shot] .proto { display: none; }
  .row .select { max-width: 240px; text-overflow: ellipsis; }
  .field .select { justify-self: start; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<aside class="proto" aria-label="Prototype controls">
  <b>Prototype</b>
  <label>Theme <select id="p-theme"><option value="dark">Dark</option><option value="light">Light</option><option value="auto">Auto</option></select></label>
  <label>Accent <select id="p-accent"></select></label>
  <label>Scenario <select id="p-scn"><option value="typical">Typical</option><option value="fresh">Fresh install</option><option value="problems">Problems</option></select></label>
  <p>Not part of the design. Every name, model and key is sample data.</p>
</aside>
<div class="window" id="win">
  <nav class="side" aria-label="Settings"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><ul class="nav" id="nav" role="listbox" tabindex="0" aria-label="Settings pages"></ul></nav>
  <main id="main"></main>
</div>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ICON = {
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',

document.addEventListener("input", (e) => {
  const t = e.target, a = t.dataset.act;
  if (!a) return;
  if (a.startsWith("draft.")) S.draft[a.slice(6)] = t.value;
  else if (a === "style.name") { S.styles[subArg].name = t.value; document.querySelector(".toolbar h1").textContent = t.value || "Style"; }
  else if (a === "style.text") S.styles[subArg].text = t.value;
  else if (a === "q") { S.q = t.value; render(); }
  else if (a === "exp.frost") { S.exp.frost = +t.value; t.style.setProperty("--v", `${t.value}%`); document.documentElement.style.setProperty("--frost", t.value / 100); }
  else if (a.startsWith("word:") && t.value.includes(",")) { addWords(a.slice(5), t.value); t.value = ""; }
});
function addWords(key, text) {
  const list = S.words[key];
  for (const part of text.split(",")) { const w = (key === "keep" ? part.trim().toLowerCase() : part.trim()).slice(0, 40); if (w && !list.some((x) => x.toLowerCase() === w.toLowerCase())) list.push(w); }
  render();
}
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (S.rec) {
    e.preventDefault();
    if (e.key === "Escape") { S.rec = null; return render(); }
    if (["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
    const k = [e.ctrlKey && "⌃", e.altKey && "⌥", e.shiftKey && "⇧", e.metaKey && "⌘", e.code.startsWith("Key") ? e.code.slice(3) : e.code.startsWith("Digit") ? e.code.slice(5) : e.key.length === 1 ? e.key.toUpperCase() : e.key].filter(Boolean);
    const which = S.rec;
    const other = Object.keys(KEYNAMES).find((w) => w !== which && keyOf(w) && keyOf(w).join() === k.join());
    S.rec = null;
    if (other) S.errs.keys = `${k.join("")} is already the ${KEYNAMES[other]} shortcut. Pick another key.`;
    else if (which === "notes") S.notes.key = k; else S.voice[which] = k;
    return render();
  }
  if (t.dataset.act?.startsWith("word:")) {
    const key = t.dataset.act.slice(5);
    if (e.key === "Enter" && t.value.trim()) { e.preventDefault(); addWords(key, t.value); }
    else if (e.key === "Backspace" && !t.value && S.words[key].length) { S.words[key].pop(); render(); }
    return;
  }
  if (t.id === "nav" && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const N = nav(), i = N.findIndex((p) => p.id === page);
    go(N[Math.max(0, Math.min(N.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))].id);
    document.getElementById("nav").focus();
  }
  if (e.key === "Escape" && sub && !t.matches("input,textarea,select")) back();
  if (e.metaKey && (e.key === "[" || e.key === "]")) { e.preventDefault(); hist(e.key === "[" ? -1 : 1); }
});
document.getElementById("p-accent").innerHTML = ACCENTS.map((a) => `<option value="${a}">${a}</option>`).join("");
document.getElementById("p-theme").onchange = (e) => { S.look.theme = e.target.value; render(); };
document.getElementById("p-accent").onchange = (e) => { S.look.accent = e.target.value; render(); };
document.getElementById("p-scn").onchange = (e) => { const look = S.look; S = scenario(e.target.value); S.look = look; lastStrip = {}; H.list = []; H.i = -1; show({ page: nav().some((p) => p.id === page) ? page : "general", sub: null, arg: null }); };
// Deep links for screenshots: #page=understand&sub=models&scn=problems&theme=light
const qs = new URLSearchParams(location.hash.slice(1));
if (qs.get("scn")) { S = scenario(qs.get("scn")); document.getElementById("p-scn").value = qs.get("scn"); }
if (qs.get("shot")) document.documentElement.dataset.shot = "";

if (qs.get("exp") === "on") S.exp.on = true;
if (qs.get("page")) page = qs.get("page");

show({ page, sub, arg: subArg });
